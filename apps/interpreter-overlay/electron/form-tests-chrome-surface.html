    function renderStandbySurface() {
      document.title = 'Form Benchmark';
      appRoot.innerHTML = '';
      const main = createElement('main', 'surface-card');
      main.appendChild(createElement('h1', 'surface-title', 'Waiting for form test'));
      main.appendChild(createElement('p', 'surface-copy', 'The next form will load here.'));
      appRoot.appendChild(main);
    }

    function applyRuntimeConfig(config) {
      currentRuntimeConfig = config;
      customSelectState = new Map();
      checkoutComboboxState = new Map();
      checkoutAddressState = new Map();
      sheinShellFieldState = new Map();
      sheinAddressFinderState = new Map();
      appRoot.innerHTML = '';
      appRoot.appendChild(renderSurface(config));
      applyInitialValues(config);
      applyDebugOpenState();
      scheduleTaskStateReport(0);
    }

    function applyDebugOpenState() {
      const params = new URLSearchParams(window.location.search);
      const debugOpen = params.get('debugOpen') || HARNESS_CONFIG.debugOpen;
      if (!debugOpen) {
        return;
      }

      window.setTimeout(() => {
        if (debugOpen === 'address-finder') {
          const root = appRoot.querySelector('.form-field[data-form-field-id="input-associated-address"] .sui-address-finder-root');
          if (root) {
            openSheinAddressFinder(root);
            const state = sheinAddressFinderState.get(root);
            if (state?.liveInput) {
              state.liveInput.value = '2401 Peabody';
              updateSheinAddressFinder(root, state.liveInput.value);
            }
          }
          return;
        }

        const fieldRoot = appRoot.querySelector(`.form-field[data-form-field-id="${debugOpen}"]`);
        if (!fieldRoot) {
          return;
        }
        const sheinShellRoot = fieldRoot.querySelector('.sui-shell-field-root');
        if (sheinShellRoot) {
          openSheinShellField(sheinShellRoot);
          return;
        }
        const addressFinderRoot = fieldRoot.querySelector('.sui-address-finder-root');
        if (addressFinderRoot) {
          openSheinAddressFinder(addressFinderRoot);
        }
      }, 80);
    }

    async function syncBootstrapState() {
      if (!HARNESS_CONFIG.bootstrapStateUrl) {
        return;
      }

      try {
        const response = await fetch(HARNESS_CONFIG.bootstrapStateUrl, { cache: 'no-store' });
        if (!response.ok) {
          return;
        }

        const payload = await response.json();
        syncVisualProbe(payload.visualProbe || null);
        if (payload.closeRequested) {
          try {
            window.close();
          } catch {}
          window.setTimeout(() => {
            if (!window.closed) {
              window.location.replace('about:blank');
            }
          }, 150);
          return;
        }

        if (!payload.sessionId || !payload.formConfig) {
          if (currentSessionId !== null || currentRuntimeConfig !== null) {
            currentSessionId = null;
            currentStateRequestId = 0;
            currentRuntimeConfig = null;
            renderStandbySurface();
          }
          return;
        }

        if (payload.sessionId !== currentSessionId) {
          currentSessionId = payload.sessionId;
          currentStateRequestId = Number(payload.stateRequestId) || 0;
          applyRuntimeConfig(payload.formConfig);
          return;
        }

        const nextStateRequestId = Number(payload.stateRequestId) || 0;
        if (nextStateRequestId !== currentStateRequestId) {
          currentStateRequestId = nextStateRequestId;
          scheduleTaskStateReport(0);
        }
      } catch {}
    }

    function startBootstrapPolling() {
      if (bootstrapPollTimer !== null) {
        clearInterval(bootstrapPollTimer);
      }
      bootstrapPollTimer = window.setInterval(() => {
        void syncBootstrapState();
      }, 250);
    }

    function startStateHeartbeat() {
      if (stateHeartbeatTimer !== null) {
        clearInterval(stateHeartbeatTimer);
      }
      stateHeartbeatTimer = window.setInterval(() => {
        scheduleTaskStateReport(0);
      }, 1000);
    }

    document.addEventListener('mousedown', (event) => {
      recordDebugEvent('dom-mousedown', {
        target: describeDebugElement(event.target),
        x: Math.round(event.clientX || 0),
        y: Math.round(event.clientY || 0),
      });
      if (
        event.target === interactivePopoverBlocker
        || interactivePopoverBlocker.contains(event.target)
      ) {
        commitAllInteractiveControls();
        return;
      }
      if (
        event.target.closest('.custom-select')
        || event.target.closest('.select-menu')
        || event.target.closest('.checkout-combobox-root')
        || event.target.closest('.checkout-address-root')
        || event.target.closest('.checkout-popover')
        || event.target.closest('.sui-shell-field-root')
        || event.target.closest('.sui-address-finder-root')
        || event.target.closest('.sui-search-result')
      ) {
        return;
      }
      commitAllInteractiveControls();
    }, true);

    document.addEventListener('click', (event) => {
      recordDebugEvent('dom-click', {
        target: describeDebugElement(event.target),
        x: Math.round(event.clientX || 0),
        y: Math.round(event.clientY || 0),
      });
    }, true);

    document.addEventListener('focusin', (event) => {
      recordDebugEvent('dom-focusin', {
        target: describeDebugElement(event.target),
      });
    }, true);

    document.addEventListener('focusout', (event) => {
      recordDebugEvent('dom-focusout', {
        target: describeDebugElement(event.target),
      });
    }, true);

    document.addEventListener('keydown', (event) => {
      if (['Enter', 'Tab', 'Escape', 'ArrowDown', 'ArrowUp', 'Backspace'].includes(event.key) || event.metaKey || event.ctrlKey) {
        recordDebugEvent('dom-keydown', {
          key: event.key,
          code: event.code,
          ctrlKey: event.ctrlKey,
          metaKey: event.metaKey,
          shiftKey: event.shiftKey,
          target: describeDebugElement(event.target),
        });
      }
      if (event.key === 'Escape') {
        closeAllInteractiveControls();
      }
    }, true);

    document.addEventListener('selectionchange', () => {
      recordDebugEvent('dom-selectionchange', {});
    });

    document.addEventListener('input', (event) => {
      recordDebugEvent('dom-input', {
        target: describeDebugElement(event.target),
      });
      scheduleTaskStateReport();
    }, true);

    document.addEventListener('change', (event) => {
      recordDebugEvent('dom-change', {
        target: describeDebugElement(event.target),
      });
      scheduleTaskStateReport();
    }, true);

    window.addEventListener('focus', () => {
      recordDebugEvent('window-focus', {});
      scheduleTaskStateReport(0);
    });

    document.addEventListener('visibilitychange', () => {
      recordDebugEvent('document-visibilitychange', {
        visibilityState: document.visibilityState,
      });
      if (document.visibilityState === 'visible') {
        scheduleTaskStateReport(0);
      }
    });

    document.addEventListener('scroll', () => {
      recordDebugEvent('document-scroll', {
        scrollX: Math.round(window.scrollX),
        scrollY: Math.round(window.scrollY),
      });
      scheduleTaskStateReport();
    }, { passive: true });

    window.addEventListener('resize', () => {
      recordDebugEvent('window-resize', {
        innerWidth: window.innerWidth,
        innerHeight: window.innerHeight,
      });
      scheduleTaskStateReport();
    });

    window.addEventListener('focus', () => {
      void syncBootstrapState();
      scheduleTaskStateReport(0);
    });

    document.addEventListener('visibilitychange', () => {
      void syncBootstrapState();
      scheduleTaskStateReport(0);
    });

    window.addEventListener('error', (event) => {
      reportPageError('window.error', event.error || event.message || 'unknown error');
    });

    window.addEventListener('unhandledrejection', (event) => {
      reportPageError('window.unhandledrejection', event.reason || 'unknown rejection');
    });

    if (HARNESS_CONFIG.formConfig) {
      currentSessionId = HARNESS_CONFIG.sessionId || 'standalone';
      currentStateRequestId = 1;
      applyRuntimeConfig(HARNESS_CONFIG.formConfig);
      startStateHeartbeat();
    } else {
      renderStandbySurface();
      startBootstrapPolling();
      startStateHeartbeat();
      void syncBootstrapState();
    }
  </script>
</body>
</html>
