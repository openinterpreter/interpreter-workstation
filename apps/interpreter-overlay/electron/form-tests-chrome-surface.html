<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Form Benchmark</title>
  <style>
    :root {
      --bg-top: #f5f5f5;
      --bg-bottom: #f5f5f5;
      --panel: rgba(255, 255, 255, 0.98);
      --panel-strong: #ffffff;
      --surface: #f8fafc;
      --surface-strong: #eef3f9;
      --line: rgba(15, 23, 42, 0.10);
      --line-strong: rgba(15, 23, 42, 0.16);
      --text: #172033;
      --muted: #607089;
      --danger: #b42318;
      --shadow: 0 18px 34px rgba(15, 23, 42, 0.08);
      --accent: #0f766e;
      --accent-soft: rgba(15, 118, 110, 0.10);
      --accent-strong: rgba(15, 118, 110, 0.18);
      --font-ui: "Aptos", "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      background: linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
      color: var(--text);
      font-family: var(--font-ui);
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    .theme-teal,
    .theme-cyan,
    .theme-sky,
    .theme-olive,
    .theme-sage {
      --accent: #0f766e;
      --accent-soft: rgba(15, 118, 110, 0.10);
      --accent-strong: rgba(15, 118, 110, 0.18);
    }

    .theme-blue,
    .theme-indigo {
      --accent: #2563eb;
      --accent-soft: rgba(37, 99, 235, 0.10);
      --accent-strong: rgba(37, 99, 235, 0.18);
    }

    .theme-amber,
    .theme-stone {
      --accent: #b45309;
      --accent-soft: rgba(180, 83, 9, 0.10);
      --accent-strong: rgba(180, 83, 9, 0.18);
    }

    .surface-card,
    .section-card,
    .success-message,
    .validation-message {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: var(--shadow);
    }

    .submit-row,
    .field-row {
      align-items: center;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .eyebrow,
    .small-label,
    .field-caption,
    .meta-copy {
      color: var(--muted);
      font-size: 11px;
    }

    .eyebrow {
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .surface-card {
      overflow: hidden;
      margin: 12px auto;
      max-width: 860px;
      min-height: calc(100vh - 24px);
      padding: 20px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .surface-header {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .surface-title {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.04em;
      margin: 0;
    }

    .surface-copy {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
      margin: 0;
    }

    .surface-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .meta-pill {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      padding: 6px 10px;
    }

    .surface-scroll {
      display: flex;
      flex: 1;
      flex-direction: column;
      gap: 14px;
      min-height: 0;
      overflow: auto;
      padding-right: 4px;
    }

    .section-card {
      background: transparent;
      border: none;
      border-radius: 0;
      box-shadow: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 0;
    }

    .section-card + .section-card {
      border-top: 1px solid var(--line);
      padding-top: 12px;
    }

    .section-title {
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .fields-grid {
      display: grid;
      gap: 14px;
      grid-template-columns: 1fr;
    }

    .fields-grid.two-column {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .form-field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 0;
    }

    .form-field.full-width {
      grid-column: 1 / -1;
    }

    .form-field label {
      font-size: 13px;
      font-weight: 700;
    }

    .required-indicator {
      color: var(--danger);
      font-weight: 800;
    }

    .form-field input,
    .form-field textarea,
    .form-field select,
    .select-trigger {
      background: var(--panel-strong);
      border: 1px solid var(--line-strong);
      border-radius: 12px;
      color: var(--text);
      min-height: 44px;
      padding: 10px 12px;
      width: 100%;
    }

    .form-field textarea {
      min-height: 112px;
      resize: vertical;
    }

    .custom-select {
      position: relative;
    }

    .select-trigger {
      align-items: center;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      text-align: left;
    }

    .select-trigger.placeholder {
      color: var(--muted);
    }

    .select-menu {
      background: var(--panel-strong);
      border: 1px solid var(--line-strong);
      border-radius: 14px;
      box-shadow: 0 22px 34px rgba(15, 23, 42, 0.12);
      display: flex;
      flex-direction: column;
      gap: 4px;
      left: 0;
      max-height: 220px;
      overflow: auto;
      padding: 6px;
      position: absolute;
      right: 0;
      top: calc(100% + 6px);
      z-index: 20;
    }

    .select-menu[hidden] {
      display: none;
    }

    .select-option {
      background: transparent;
      border: 1px solid transparent;
      border-radius: 10px;
      color: var(--text);
      cursor: pointer;
      min-height: 38px;
      padding: 8px 10px;
      text-align: left;
    }

    .select-option:hover,
    .select-option.highlighted,
    .select-option:focus {
      background: var(--accent-soft);
      border-color: var(--accent-strong);
      outline: none;
    }

    .surface-checkout-shipping-ax-trap {
      --bg-top: #f6f6f6;
      --bg-bottom: #f6f6f6;
      --panel: rgba(255, 255, 255, 0.98);
      --panel-strong: #ffffff;
      --surface: #f4f4f4;
      --surface-strong: #efefef;
      --line: rgba(68, 64, 60, 0.10);
      --line-strong: rgba(68, 64, 60, 0.18);
      --text: #1c1917;
      --muted: #6b645c;
      --accent: #111827;
      --accent-soft: rgba(17, 24, 39, 0.06);
      --accent-strong: rgba(17, 24, 39, 0.16);
      --shadow: 0 12px 24px rgba(28, 25, 23, 0.04);
      --font-ui: "Helvetica Neue", "Arial", sans-serif;
    }

    .surface-checkout-shipping-ax-trap .surface-card {
      background: transparent;
      border: none;
      border-radius: 0;
      box-shadow: none;
      margin: 0 auto;
      max-width: 1120px;
      min-height: 100vh;
      padding: 16px 18px 28px;
    }

    .benchmark-two-up {
      align-items: start;
      display: grid;
      gap: 18px;
      grid-template-columns: 380px minmax(0, 1fr);
    }

    .benchmark-source-pane {
      background: #fff;
      border: 1px solid rgba(68, 64, 60, 0.08);
      min-width: 0;
      padding: 10px 12px 14px;
    }

    .benchmark-source-pane .source-app-row {
      align-items: baseline;
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }

    .benchmark-source-pane .source-app-name {
      color: #1f2937;
      font-size: 14px;
      font-weight: 700;
    }

    .benchmark-source-pane .source-workspace {
      color: #9a8f84;
      font-size: 10px;
      font-weight: 600;
      text-transform: none;
    }

    .benchmark-source-card {
      border: 1px solid rgba(68, 64, 60, 0.08);
      border-radius: 10px;
      padding: 10px 12px;
    }

    .benchmark-source-title {
      color: #111827;
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 2px;
    }

    .benchmark-source-subtitle {
      color: #8a8178;
      font-size: 11px;
      margin-bottom: 8px;
    }

    .benchmark-source-pill {
      align-items: center;
      background: #f3f4f6;
      border-radius: 999px;
      color: #6b7280;
      display: inline-flex;
      font-size: 10px;
      font-weight: 600;
      margin-bottom: 10px;
      padding: 2px 8px;
    }

    .benchmark-source-section {
      border: 1px solid rgba(68, 64, 60, 0.08);
      border-radius: 10px;
      margin-top: 10px;
      padding: 10px 12px;
    }

    .benchmark-source-section-title {
      color: #4b5563;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.04em;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    .benchmark-source-line {
      color: #1f2937;
      font-size: 13px;
      line-height: 1.45;
      margin-bottom: 6px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .benchmark-source-line:last-child {
      margin-bottom: 0;
    }

    .checkout-site-header {
      margin: -16px -18px 12px;
    }

    .checkout-brand-row {
      align-items: center;
      background: #fff;
      border-bottom: 1px solid rgba(68, 64, 60, 0.08);
      display: flex;
      justify-content: space-between;
      min-height: 34px;
      padding: 0 44px;
    }

    .checkout-brand-mark {
      color: #111;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 0.16em;
      line-height: 1;
    }

    .checkout-secure-status {
      align-items: center;
      color: #6aa84f;
      display: inline-flex;
      font-size: 13px;
      font-weight: 600;
      gap: 6px;
      white-space: nowrap;
    }

    .checkout-secure-status::before {
      align-items: center;
      background: #6aa84f;
      border-radius: 999px;
      color: #fff;
      content: "🔒";
      display: inline-flex;
      font-size: 9px;
      height: 18px;
      justify-content: center;
      width: 18px;
    }

    .checkout-perks-strip {
      align-items: center;
      background: #f1f8eb;
      color: #69a44b;
      display: flex;
      font-size: 10px;
      gap: 14px;
      min-height: 28px;
      padding: 0 44px;
    }

    .checkout-perks-strip span {
      white-space: nowrap;
    }

    .surface-checkout-shipping-ax-trap .surface-header {
      border-bottom: 1px solid rgba(68, 64, 60, 0.08);
      gap: 4px;
      margin-bottom: 6px;
      padding-bottom: 6px;
    }

    .checkout-progress {
      color: #8a8178;
      display: flex;
      font-size: 11px;
      gap: 10px;
      justify-content: center;
      margin-bottom: 4px;
    }

    .checkout-progress .current {
      color: #4b5563;
      font-weight: 700;
    }

    .checkout-layout {
      display: grid;
      gap: 20px;
      grid-template-columns: minmax(0, 1fr) 332px;
      align-items: start;
    }

    .checkout-main-column {
      background: #fff;
      border: 1px solid rgba(68, 64, 60, 0.08);
      min-width: 0;
      padding: 8px 12px 12px;
    }

    .checkout-sidebar {
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-width: 0;
    }

    .checkout-summary-card {
      background: #fff;
      border: 1px solid rgba(68, 64, 60, 0.08);
      padding: 14px 14px 16px;
    }

    .checkout-summary-card h3 {
      font-size: 18px;
      font-weight: 700;
      margin: 0 0 10px;
    }

    @media (max-width: 1180px) {
      .benchmark-two-up {
        grid-template-columns: 1fr;
      }

      .expense-layout {
        grid-template-columns: 1fr;
      }
    }

    .checkout-summary-row {
      display: flex;
      font-size: 14px;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .checkout-summary-row.muted {
      color: #78716c;
      font-size: 13px;
    }

    .checkout-summary-row.total {
      color: #ef6a44;
      font-size: 17px;
      font-weight: 700;
      margin-top: 10px;
    }

    .checkout-reward-card {
      background: linear-gradient(180deg, #fff6eb 0%, #fff 100%);
      border: 1px solid rgba(239, 106, 68, 0.14);
    }

    .checkout-reward-banner {
      background: linear-gradient(135deg, rgba(255, 204, 142, 0.28), rgba(255, 232, 204, 0.64));
      color: #9a5c24;
      font-size: 13px;
      line-height: 1.4;
      padding: 12px;
    }

    .checkout-action-card {
      background: #fff;
      border: 1px solid rgba(68, 64, 60, 0.08);
      padding: 14px 14px 16px;
    }

    .checkout-action-card h4 {
      color: #292524;
      font-size: 15px;
      font-weight: 700;
      margin: 0 0 10px;
    }

    .checkout-inline-fields {
      display: grid;
      gap: 8px;
      grid-template-columns: 1fr auto;
    }

    .checkout-inline-fields .ghost-input {
      align-items: center;
      background: #f6f6f6;
      border: 1px solid rgba(68, 64, 60, 0.12);
      color: #a8a29e;
      display: inline-flex;
      font-size: 13px;
      min-height: 34px;
      padding: 0 10px;
    }

    .checkout-inline-fields .ghost-button {
      align-items: center;
      background: #e7e5e4;
      border: 1px solid rgba(68, 64, 60, 0.12);
      color: #b0b0b0;
      display: inline-flex;
      font-size: 13px;
      font-weight: 700;
      justify-content: center;
      min-height: 34px;
      min-width: 78px;
      padding: 0 14px;
    }

    .checkout-card-note {
      color: #78716c;
      font-size: 12px;
      line-height: 1.35;
    }

    .surface-checkout-shipping-ax-trap .surface-title {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 0;
    }

    .surface-checkout-shipping-ax-trap .surface-copy,
    .surface-checkout-shipping-ax-trap .surface-meta,
    .surface-checkout-shipping-ax-trap .section-title,
    .surface-checkout-shipping-ax-trap .submit-row .small-label {
      display: none;
    }

    .surface-checkout-shipping-ax-trap .form-field label {
      font-size: 14px;
      font-weight: 600;
    }

    .surface-checkout-shipping-ax-trap .field-caption {
      font-size: 12px;
    }

    .surface-checkout-shipping-ax-trap .fields-grid.two-column {
      column-gap: 12px;
      row-gap: 8px;
    }

    .surface-expense-report-js-lab .surface-card {
      background:
        radial-gradient(circle at top right, rgba(15, 23, 42, 0.08), transparent 28%),
        linear-gradient(180deg, #f7fafc 0%, #eef3f8 100%);
      border-radius: 28px;
      box-shadow: 0 26px 72px rgba(15, 23, 42, 0.12);
      padding: 18px;
    }

    .expense-shell-header {
      align-items: center;
      background: rgba(255, 255, 255, 0.86);
      border: 1px solid rgba(15, 23, 42, 0.08);
      border-radius: 18px;
      display: flex;
      justify-content: space-between;
      margin-bottom: 14px;
      padding: 14px 16px;
    }

    .expense-shell-copy {
      display: grid;
      gap: 4px;
    }

    .expense-shell-kicker {
      color: #64748b;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .expense-shell-title {
      color: #0f172a;
      font-size: 21px;
      font-weight: 700;
      letter-spacing: -0.05em;
    }

    .expense-shell-meta {
      align-items: center;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .expense-chip {
      background: rgba(15, 23, 42, 0.04);
      border: 1px solid rgba(15, 23, 42, 0.08);
      border-radius: 999px;
      color: #334155;
      font-size: 11px;
      font-weight: 700;
      padding: 5px 10px;
    }

    .expense-chip.accent {
      background: rgba(14, 116, 144, 0.1);
      border-color: rgba(14, 116, 144, 0.18);
      color: #0f766e;
    }

    .expense-layout {
      display: grid;
      flex: 1;
      gap: 18px;
      grid-template-columns: minmax(0, 1fr) 292px;
      align-items: start;
      min-height: 0;
    }

    .expense-main-column {
      background: rgba(255, 255, 255, 0.94);
      border: 1px solid rgba(15, 23, 42, 0.08);
      border-radius: 22px;
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
      padding: 16px;
    }

    .expense-sidebar {
      display: grid;
      gap: 12px;
      min-width: 0;
    }

    .surface-expense-report-js-lab .expense-main-column .surface-scroll {
      flex: 1;
      min-height: 0;
    }

    .expense-card {
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid rgba(15, 23, 42, 0.08);
      border-radius: 18px;
      display: grid;
      gap: 12px;
      padding: 14px;
    }

    .expense-card h3,
    .expense-card h4 {
      color: #0f172a;
      font-size: 15px;
      font-weight: 700;
      margin: 0;
    }

    .expense-card p,
    .expense-card li,
    .expense-card span {
      color: #475569;
      font-size: 13px;
      line-height: 1.45;
    }

    .expense-card ul {
      display: grid;
      gap: 8px;
      margin: 0;
      padding-left: 16px;
    }

    .expense-summary-grid {
      display: grid;
      gap: 8px;
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .expense-stat {
      background: rgba(15, 23, 42, 0.03);
      border: 1px solid rgba(15, 23, 42, 0.07);
      border-radius: 14px;
      display: grid;
      gap: 4px;
      padding: 10px;
    }

    .expense-stat strong {
      color: #0f172a;
      font-size: 18px;
      letter-spacing: -0.04em;
    }

    .expense-upload-dock {
      align-items: center;
      background: linear-gradient(135deg, rgba(14, 116, 144, 0.08), rgba(14, 165, 233, 0.04));
      border: 1px dashed rgba(14, 116, 144, 0.3);
      border-radius: 16px;
      color: #0f172a;
      display: flex;
      justify-content: center;
      min-height: 84px;
      text-align: center;
    }

    .surface-expense-report-js-lab .surface-header {
      border-bottom: 1px solid rgba(15, 23, 42, 0.08);
      margin-bottom: 10px;
      padding-bottom: 12px;
    }

    .surface-expense-report-js-lab .surface-title {
      color: #0f172a;
      font-size: 28px;
    }

    .surface-expense-report-js-lab .surface-copy {
      color: #475569;
    }

    .surface-expense-report-js-lab .section-card,
    .surface-expense-report-js-lab .validation-message,
    .surface-expense-report-js-lab .success-message,
    .surface-expense-report-js-lab .submit-row {
      border-radius: 18px;
    }

    .surface-checkout-shipping-ax-trap .addr-field {
      display: flex;
      flex-direction: column;
      gap: 0;
      min-width: 0;
      position: relative;
    }

    .surface-checkout-shipping-ax-trap .addr-field.grid-col-12 {
      grid-column: 1 / -1;
    }

    .surface-checkout-shipping-ax-trap .sui-popover__trigger,
    .surface-checkout-shipping-ax-trap .sui-select__trigger {
      width: 100%;
    }

    .surface-checkout-shipping-ax-trap .sui-input-titlewarp {
      background: var(--panel-strong);
      border: 1px solid var(--line-strong);
      border-radius: 4px;
      display: flex;
      flex-direction: column;
      min-height: 44px;
      width: 100%;
    }

    .surface-checkout-shipping-ax-trap .sui-input-titlewarp__preblock {
      align-items: stretch;
      display: flex;
      flex: 0 0 auto;
    }

    .surface-checkout-shipping-ax-trap .input-preblock-module,
    .surface-checkout-shipping-ax-trap .exit-list__item {
      align-items: center;
      border-right: 1px solid var(--line);
      display: inline-flex;
      font-size: 13px;
      min-width: 78px;
      padding: 0 12px;
      white-space: nowrap;
    }

    .surface-checkout-shipping-ax-trap .sui-input-title,
    .surface-checkout-shipping-ax-trap .sui-textarea-title {
      display: flex;
      flex-direction: column;
      width: 100%;
    }

    .surface-checkout-shipping-ax-trap .sui-input-title__bd,
    .surface-checkout-shipping-ax-trap .sui-textarea-title {
      display: flex;
      flex-direction: column;
      position: relative;
      width: 100%;
    }

    .surface-checkout-shipping-ax-trap .sui-input-title__name,
    .surface-checkout-shipping-ax-trap .sui-textarea-title__name {
      color: var(--text);
      font-size: 11px;
      font-weight: 500;
      padding: 6px 8px 0;
    }

    .surface-checkout-shipping-ax-trap .sui-shell-field-root.compact-shell .sui-input-title__name {
      display: none;
    }

    .surface-checkout-shipping-ax-trap .sui-input-title__inner,
    .surface-checkout-shipping-ax-trap .sui-textarea-title__inner {
      appearance: none;
      background: transparent;
      border: 0;
      color: var(--text);
      font-size: 14px;
      min-height: 32px;
      outline: none;
      padding: 0 36px 8px 10px;
      width: 100%;
    }

    .surface-checkout-shipping-ax-trap .sui-shell-field-root.is-open > .sui-input-titlewarp,
