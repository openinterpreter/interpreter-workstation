<body>
  <div id="app"></div>
  <div id="interactive-popover-blocker" class="interactive-popover-blocker" hidden aria-hidden="true"></div>

  <script>
    const HARNESS_CONFIG = __FORM_TEST_CONFIG__;
    const appRoot = document.getElementById('app');
    const interactivePopoverBlocker = document.getElementById('interactive-popover-blocker');
    const DEBUG_OPEN_FIELD = HARNESS_CONFIG.debugOpen || null;
    let currentSessionId = null;
    let currentStateRequestId = 0;
    let currentRuntimeConfig = null;
    let bootstrapPollTimer = null;
    let stateHeartbeatTimer = null;
    let customSelectState = new Map();
    let checkoutComboboxState = new Map();
    let checkoutAddressState = new Map();
    let sheinShellFieldState = new Map();
    let sheinAddressFinderState = new Map();
    let currentVisualProbe = null;
    let reportStateTimer = null;
    let reportStateMicrotaskQueued = false;
    let reportStateInFlight = false;
    const FORM_DEBUG_EVENT_LIMIT = 1500;
    let formDebugEventSeq = 0;
    const formDebugEvents = [];
    let lastReportedDebugEventSeq = 0;

    function reportPageError(context, error) {
      if (!HARNESS_CONFIG.reportStateUrl || !currentSessionId) {
        return;
      }
      const payload = JSON.stringify({
        sessionId: currentSessionId,
        context,
        message: error instanceof Error ? error.message : String(error),
        stack: error instanceof Error ? String(error.stack || '') : '',
      });
      const errorUrl = HARNESS_CONFIG.reportStateUrl.replace(/\/session-state$/, '/session-state-error');
      try {
        if (navigator.sendBeacon) {
          const ok = navigator.sendBeacon(errorUrl, new Blob([payload], { type: 'application/json' }));
          if (ok) {
            return;
          }
        }
      } catch {}
      void fetch(errorUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: payload,
        keepalive: true,
      }).catch(() => {});
    }

    function syncInteractivePopoverBlocker() {
      const sheinShellOpen = Array.from(sheinShellFieldState.entries()).some(([root, state]) => {
        return root.classList.contains('is-open') || (!state.popover.hidden);
      });
      const sheinAddressOpen = Array.from(sheinAddressFinderState.entries()).some(([root, state]) => {
        return root.classList.contains('is-open') || (!state.popover.hidden);
      });
      interactivePopoverBlocker.hidden = !(sheinShellOpen || sheinAddressOpen);
    }

    function syncVisualProbe(probe) {
      currentVisualProbe = probe && probe.dataUrl && probe.bounds ? probe : null;
      let image = document.getElementById('form-target-visual-probe');
      if (!currentVisualProbe) {
        image?.remove();
        return;
      }
      if (!image) {
        image = document.createElement('img');
        image.id = 'form-target-visual-probe';
        image.className = 'form-visual-probe';
        image.alt = currentVisualProbe.label || 'target visual probe';
        document.body.appendChild(image);
      }
      image.src = currentVisualProbe.dataUrl;
      image.style.left = `${Math.round(currentVisualProbe.bounds.x)}px`;
      image.style.top = `${Math.round(currentVisualProbe.bounds.y)}px`;
      image.style.width = `${Math.round(currentVisualProbe.bounds.width)}px`;
      image.style.height = `${Math.round(currentVisualProbe.bounds.height)}px`;
    }

    function getVisualProbeDebugState() {
      const image = document.getElementById('form-target-visual-probe');
      if (!(image instanceof HTMLElement) || !currentVisualProbe) {
        return null;
      }
      const rect = image.getBoundingClientRect();
      if (rect.width <= 0 || rect.height <= 0) {
        return null;
      }
      const screenLeft = window.screenX + Math.round((window.outerWidth - window.innerWidth) / 2);
      const screenTop = window.screenY + Math.round(window.outerHeight - window.innerHeight);
      return {
        id: currentVisualProbe.id || '',
        viewportBounds: {
          x: Math.round(rect.left),
          y: Math.round(rect.top),
          width: Math.round(rect.width),
          height: Math.round(rect.height),
        },
        screenBounds: {
          x: Math.round(screenLeft + rect.left),
          y: Math.round(screenTop + rect.top),
          width: Math.round(rect.width),
          height: Math.round(rect.height),
        },
        devicePixelRatio: window.devicePixelRatio || 1,
      };
    }

    function insertEditorBeforeReference(container, editor, reference) {
      if (reference && reference.parentNode instanceof HTMLElement) {
        reference.parentNode.insertBefore(editor, reference);
        return;
      }
      container.appendChild(editor);
    }

    function createElement(tag, className, text) {
      const element = document.createElement(tag);
      if (className) {
        element.className = className;
      }
      if (text !== undefined) {
        element.textContent = text;
      }
      return element;
    }

    function truncateDebugText(value, maxLength = 140) {
      const normalized = String(value ?? '').replace(/\s+/g, ' ').trim();
      if (normalized.length <= maxLength) {
        return normalized;
      }
      return `${normalized.slice(0, maxLength - 1)}…`;
    }

    function getClosestFormFieldId(node) {
      if (!(node instanceof Element)) {
        return null;
      }
      return node.closest('.form-field[data-form-field-id]')?.dataset.formFieldId || null;
    }

    function describeDebugElement(node) {
      if (!(node instanceof Element)) {
        return null;
      }

      const description = {
        tag: node.tagName.toLowerCase(),
      };

      const fieldId = getClosestFormFieldId(node);
      if (fieldId) {
        description.fieldId = fieldId;
      }

      const role = node.getAttribute('role');
      if (role) {
        description.role = role;
      }

      if (node instanceof HTMLInputElement) {
        description.inputType = node.type;
        if (node.type !== 'hidden') {
          description.value = truncateDebugText(node.value);
        }
        if (node.type === 'checkbox' || node.type === 'radio') {
          description.checked = node.checked;
        }
      } else if (node instanceof HTMLTextAreaElement || node instanceof HTMLSelectElement) {
        description.value = truncateDebugText(node.value);
      } else if (node.getAttribute('value')) {
        description.value = truncateDebugText(node.getAttribute('value'));
      }

      const ariaLabel = node.getAttribute('aria-label');
      if (ariaLabel) {
        description.ariaLabel = truncateDebugText(ariaLabel);
      }

      const title = node.getAttribute('title');
      if (title && title !== ariaLabel) {
        description.title = truncateDebugText(title);
      }

      if (node.id) {
        description.id = node.id;
      }

      if (node.className && typeof node.className === 'string') {
        description.className = truncateDebugText(node.className, 120);
      }

      const text = truncateDebugText(node.textContent || '', 90);
      if (text) {
        description.text = text;
      }

      const expanded = node.getAttribute('aria-expanded');
      if (expanded != null) {
        description.expanded = expanded;
      }

      return description;
    }

    function getSelectionSummary() {
      const docSelection = document.getSelection();
      if (!docSelection || docSelection.rangeCount === 0) {
        return null;
      }

      const summary = {
        isCollapsed: docSelection.isCollapsed,
        text: truncateDebugText(docSelection.toString(), 160),
      };

      const anchorNode = docSelection.anchorNode instanceof Element
        ? docSelection.anchorNode
        : docSelection.anchorNode?.parentElement || null;
      const focusNode = docSelection.focusNode instanceof Element
        ? docSelection.focusNode
        : docSelection.focusNode?.parentElement || null;

      if (anchorNode) {
        summary.anchor = describeDebugElement(anchorNode);
      }
      if (focusNode) {
        summary.focus = describeDebugElement(focusNode);
      }

      return summary;
    }

    function collectVisibleFieldValues() {
      const values = {};
      appRoot.querySelectorAll('.form-field[data-form-field-id]').forEach((fieldRoot) => {
        if (!(fieldRoot instanceof HTMLElement) || !isVisible(fieldRoot)) {
          return;
        }
        const fieldId = fieldRoot.dataset.formFieldId;
        if (!fieldId) {
          return;
        }
        values[fieldId] = truncateDebugText(getFieldValue(fieldRoot), 120);
      });
      return values;
    }

    function collectOpenControlState() {
      const openControls = [];

      sheinShellFieldState.forEach((state, root) => {
        if (root.classList.contains('is-open') || !state.popover.hidden) {
          openControls.push({
            kind: 'shein-shell',
            fieldId: state.field.id,
            highlightedValue: root.dataset.highlightedValue || '',
            liveValue: truncateDebugText(state.liveInput?.value || ''),
          });
        }
      });

      sheinAddressFinderState.forEach((state, root) => {
        if (root.classList.contains('is-open') || !state.popover.hidden) {
          openControls.push({
            kind: 'address-finder',
            fieldId: state.field.id,
            liveValue: truncateDebugText(state.liveInput?.value || ''),
            options: Array.from(state.resultList.querySelectorAll('button')).slice(0, 5).map((button) => truncateDebugText(button.textContent || '')),
          });
        }
      });

      checkoutComboboxState.forEach((state, root) => {
        if (root.classList.contains('editing') || !state.popover.hidden) {
          openControls.push({
            kind: 'checkout-combobox',
            fieldId: state.field.id,
            highlightedValue: root.dataset.highlightedValue || '',
            liveValue: truncateDebugText(state.input?.value || ''),
          });
        }
      });

      checkoutAddressState.forEach((state) => {
        if (!state.popover.hidden) {
          openControls.push({
            kind: 'checkout-address',
            fieldId: state.field.id,
            liveValue: truncateDebugText(state.input?.value || ''),
            options: Array.from(state.popover.querySelectorAll('button')).slice(0, 5).map((button) => truncateDebugText(button.textContent || '')),
          });
        }
      });

      return openControls;
    }

    function recordDebugEvent(type, details = {}) {
      const activeElement = describeDebugElement(document.activeElement);
      const selection = getSelectionSummary();
      const snapshot = {
        seq: ++formDebugEventSeq,
        timeMs: Math.round(performance.now()),
        type,
        activeElement,
        selection,
        openControls: collectOpenControlState(),
        visibleValues: collectVisibleFieldValues(),
      };

      Object.entries(details).forEach(([key, value]) => {
        if (value !== undefined) {
          snapshot[key] = value;
        }
      });

      formDebugEvents.push(snapshot);
      if (formDebugEvents.length > FORM_DEBUG_EVENT_LIMIT) {
        formDebugEvents.splice(0, formDebugEvents.length - FORM_DEBUG_EVENT_LIMIT);
      }
    }

    function capturePageDebugState() {
      return {
        activeElement: describeDebugElement(document.activeElement),
        selection: getSelectionSummary(),
        openControls: collectOpenControlState(),
        visibleValues: collectVisibleFieldValues(),
        visualProbe: getVisualProbeDebugState(),
        eventCount: formDebugEvents.length,
        lastEventSeq: formDebugEventSeq,
      };
    }

    function isVisible(element) {
      if (!element) {
        return false;
      }

      const rect = element.getBoundingClientRect();
      if (rect.width <= 1 || rect.height <= 1) {
        return false;
      }

      const visibleWidth = Math.max(0, Math.min(rect.right, window.innerWidth) - Math.max(rect.left, 0));
      const visibleHeight = Math.max(0, Math.min(rect.bottom, window.innerHeight) - Math.max(rect.top, 0));
      const visibleArea = visibleWidth * visibleHeight;
      const totalArea = rect.width * rect.height;
      return totalArea > 0 && visibleArea / totalArea >= 0.6;
    }

    function normalizeInputType(type) {
      switch (type) {
        case 'textarea':
        case 'radio':
        case 'checkbox':
        case 'select':
          return type;
        default:
          return 'text';
      }
    }

    function resolveFieldSemanticLabel(field, target, fallbackLabel) {
      const targetKey = `ax${target.charAt(0).toUpperCase()}${target.slice(1)}Label`;
      if (Object.prototype.hasOwnProperty.call(field, targetKey)) {
        return field[targetKey];
      }
      if (Object.prototype.hasOwnProperty.call(field, 'axLabel')) {
        return field.axLabel;
      }
      return fallbackLabel;
    }

    function applyFieldSemantics(element, field, labelText, target = 'field') {
      const resolvedLabel = resolveFieldSemanticLabel(field, target, labelText);
      if (resolvedLabel == null || resolvedLabel === false || resolvedLabel === '') {
        element.removeAttribute('aria-label');
        element.removeAttribute('title');
      } else {
        element.setAttribute('aria-label', String(resolvedLabel));
        element.setAttribute('title', String(resolvedLabel));
      }
      element.dataset.required = field.required ? 'true' : 'false';
      if ('required' in element) {
        element.required = Boolean(field.required);
      }
      element.setAttribute('aria-required', field.required ? 'true' : 'false');
      if (element instanceof HTMLInputElement || element instanceof HTMLTextAreaElement) {
        // Keep Chrome/browser autofill out of the benchmark so the page's own UI is the only thing in play.
        element.autocomplete = 'off';
        element.setAttribute('autocapitalize', 'off');
        element.setAttribute('autocorrect', 'off');
        element.spellcheck = false;
        if (element instanceof HTMLInputElement && element.type === 'text') {
          element.setAttribute('autocomplete', 'new-password');
        }
      }
      if (field.validationMessage && field.axDescribeWithValidation) {
        element.setAttribute('aria-describedby', `${field.id}-validation`);
        element.setAttribute('aria-invalid', 'true');
      }
    }

    function getFieldValue(field) {
      const firstInput = field.querySelector('input, textarea, select');
      if (!firstInput) {
        return '';
      }

      if (firstInput instanceof HTMLInputElement && firstInput.type === 'radio') {
        const checked = field.querySelector('input[type="radio"]:checked');
        return checked ? checked.value : '';
      }

      if (firstInput instanceof HTMLInputElement && firstInput.type === 'checkbox') {
        return Array.from(field.querySelectorAll('input[type="checkbox"]:checked')).map((input) => input.value);
      }

      return firstInput.value || '';
    }

    function markFieldValidity(field, isValid) {
      field.classList.toggle('invalid', !isValid);
    }

    function validateRequiredFields(main) {
      const fields = Array.from(main.querySelectorAll('.form-field[data-form-field-id]'));
      const invalidFields = [];

      fields.forEach((field) => {
        if (field.dataset.required !== 'true') {
          markFieldValidity(field, true);
          return;
        }

        const value = getFieldValue(field);
        const isValid = Array.isArray(value) ? value.length > 0 : String(value).trim().length > 0;
        markFieldValidity(field, isValid);
        if (!isValid) {
          invalidFields.push(field);
        }
      });

      const validationMessage = main.querySelector('[data-validation-message="true"]');
      if (validationMessage) {
        validationMessage.style.display = invalidFields.length > 0 ? 'block' : 'none';
      }

      if (invalidFields.length > 0) {
        invalidFields[0].scrollIntoView({ block: 'center', behavior: 'instant' });
      }

      return invalidFields.length === 0;
    }

    function closeAllCustomSelects(exceptRoot) {
      appRoot.querySelectorAll('.custom-select').forEach((root) => {
        if (exceptRoot && root === exceptRoot) {
          return;
        }
        const state = customSelectState.get(root);
        if (!state) {
          return;
        }
        state.trigger.setAttribute('aria-expanded', 'false');
        state.menu.hidden = true;
        delete root.dataset.highlightedValue;
      });
    }

    function getCustomSelectOptions(root) {
      return Array.from(root.querySelectorAll('.select-option'));
    }

    function setHighlightedCustomOption(root, option) {
      getCustomSelectOptions(root).forEach((entry) => {
        const active = entry === option;
        entry.classList.toggle('highlighted', active);
        entry.setAttribute('aria-selected', active ? 'true' : 'false');
      });
      if (option) {
        root.dataset.highlightedValue = option.dataset.selectValue || '';
        option.scrollIntoView({ block: 'nearest' });
      } else {
        delete root.dataset.highlightedValue;
      }
    }

    function selectCustomOption(root, optionText) {
      const state = customSelectState.get(root);
      if (!state) {
        return false;
      }
      const option = getCustomSelectOptions(root).find((entry) => entry.dataset.selectValue === optionText);
      if (!option) {
        return false;
      }
      state.input.value = optionText;
      state.trigger.classList.remove('placeholder');
      state.valueLabel.textContent = optionText;
      state.trigger.setAttribute('aria-label', `${state.fieldLabel}: ${optionText}`);
      setHighlightedCustomOption(root, option);
      closeAllInteractiveControls();
      recordDebugEvent('custom-select-option-selected', {
        fieldId: state.input?.dataset.fieldId || getClosestFormFieldId(state.trigger),
        optionText,
      });
      scheduleTaskStateReport();
      return true;
    }

    function getFieldConfig(fieldId) {
      return (currentRuntimeConfig?.fields || []).find((field) => field.id === fieldId) || null;
    }

    function resolveSheinFieldOptions(field, filterText = '') {
      const normalizedFilter = String(filterText || '').trim().toLowerCase();
      const sections = [];
      if (Array.isArray(field.menuSections) && field.menuSections.length > 0) {
        field.menuSections.forEach((section) => {
          const options = (section.options || []).filter((option) => {
            if (!normalizedFilter) {
              return true;
            }
            return String(option).toLowerCase().includes(normalizedFilter);
          });
          if (options.length > 0) {
            sections.push({ title: section.title || '', options });
          }
        });
        return sections;
      }

      const dynamicOptions = resolveDynamicOptions(field).filter((option) => {
        if (!normalizedFilter) {
          return true;
        }
        return String(option).toLowerCase().includes(normalizedFilter);
      });
      return dynamicOptions.length > 0 ? [{ title: '', options: dynamicOptions }] : [];
    }

    function setSheinDisplayValue(state, value) {
      const normalized = String(value || '');
      if (!state || !state.displayInput) {
        return;
      }
      state.displayInput.value = normalized;
      if (state.displayInput.tagName === 'TEXTAREA') {
        state.displayInput.textContent = normalized;
      }
      state.shell.classList.toggle('placeholder', normalized.trim().length === 0);
      state.shell.classList.toggle('has-committed-value', normalized.trim().length > 0);
    }

    function shouldShowSheinValidation(field, rawValue) {
      if (!field || !field.validationMessage) {
        return false;
      }
      const value = String(rawValue || '').trim();
      if (!value) {
        return false;
      }

      if (field.id === 'input-first-name' || field.id === 'input-last-name') {
        return !/^[A-Za-z ]{2,34}$/.test(value);
      }

      if (field.id === 'input-phone-number') {
        const digits = value.replace(/\D/g, '');
        return digits.length !== 10;
      }

      if (field.id === 'input-address1') {
        return value.length < 5 || value.length > 30 || value.includes('@');
      }

      return false;
    }

    function updateSheinShellValidation(root, rawValue) {
      const state = sheinShellFieldState.get(root);
      if (!state) {
        return;
      }
      const note = root.querySelector('.addr-input__note, .sui-textarea-title__msg');
      const invalid = shouldShowSheinValidation(state.field, rawValue);
      root.classList.toggle('is-invalid', invalid);
      if (note) {
        note.style.display = invalid ? 'block' : 'none';
      }
      if (state.shell) {
        if (invalid && state.field.axDescribeWithValidation) {
          state.shell.setAttribute('aria-invalid', 'true');
          state.shell.setAttribute('aria-describedby', `${state.field.id}-validation`);
        } else {
          state.shell.removeAttribute('aria-invalid');
          state.shell.removeAttribute('aria-describedby');
        }
      }
    }

    function updateTextareaFieldValidation(fieldRoot, field, rawValue) {
      const note = fieldRoot.querySelector('.sui-textarea-title__msg');
      if (!note) {
        return;
      }
      note.style.display = shouldShowSheinValidation(field, rawValue) ? 'block' : 'none';
    }

    function setFieldCommittedValue(fieldId, rawValue, options = {}) {
      const field = getFieldConfig(fieldId);
      const fieldRoot = appRoot.querySelector(`.form-field[data-form-field-id="${fieldId}"]`);
      if (!field || !fieldRoot) {
        return;
      }
      const normalized = String(rawValue ?? '');
      const source = options.source || 'internal';

      if (field.controlVariant === 'shein-shell-field' || field.controlVariant === 'shein-static-select') {
        const root = fieldRoot.querySelector('.sui-shell-field-root');
        const state = root ? sheinShellFieldState.get(root) : null;
        if (state) {
          const previousValue = state.hiddenInput.value || '';
          state.hiddenInput.value = normalized;
          setSheinDisplayValue(state, normalized);
          updateSheinShellValidation(root, normalized);
          if (previousValue !== normalized) {
            recordDebugEvent('field-committed', {
              fieldId,
              previousValue: truncateDebugText(previousValue),
              committedValue: truncateDebugText(normalized),
              source,
            });
          }
          if (!options.skipDependents && previousValue !== normalized) {
            clearDependentCheckoutFields(fieldId);
          }
          return;
        }
      }

      if (field.controlVariant === 'shein-address-finder') {
        const root = fieldRoot.querySelector('.sui-address-finder-root');
        const state = root ? sheinAddressFinderState.get(root) : null;
        if (state) {
          const previousValue = state.hiddenInput.value || '';
          state.hiddenInput.value = normalized;
          state.displayInput.value = normalized;
          state.shell.classList.toggle('placeholder', normalized.trim().length === 0);
          if (previousValue !== normalized) {
            recordDebugEvent('field-committed', {
              fieldId,
              previousValue: truncateDebugText(previousValue),
              committedValue: truncateDebugText(normalized),
              source,
            });
          }
          return;
        }
      }

      const directInput = fieldRoot.querySelector('input, textarea, select');
      if (directInput) {
        const previousValue = directInput.value || '';
        directInput.value = normalized;
        if (field.type === 'textarea') {
          updateTextareaFieldValidation(fieldRoot, field, normalized);
        }
        if (previousValue !== normalized) {
          recordDebugEvent('field-committed', {
            fieldId,
            previousValue: truncateDebugText(previousValue),
            committedValue: truncateDebugText(normalized),
            source,
          });
        }
      }
    }

    function renderSheinFieldMenu(root, filterText = '') {
      const state = sheinShellFieldState.get(root);
      if (!state || !state.popover) {
        return;
      }
      const sections = resolveSheinFieldOptions(state.field, filterText);
      state.popover.innerHTML = '';
      if (sections.length === 0) {
        if (state.field.commitMode === 'option-only') {
          const dependencyHint = state.field.dependsOn && !getCommittedFieldValue(state.field.dependsOn)
            ? 'Choose the previous field first.'
            : 'No matching options.';
          state.popover.appendChild(createElement('div', 'checkout-empty-state', dependencyHint));
        }
        delete root.dataset.highlightedValue;
        return;
      }
      const menu = createElement('ul', 'sui-select__menu');
      menu.setAttribute('role', 'listbox');
      const currentHighlightedValue = root.dataset.highlightedValue || '';
      const allOptionValues = sections.flatMap((section) => section.options.map(String));
      const shouldResetHighlight = !allOptionValues.includes(currentHighlightedValue);
      if (shouldResetHighlight) {
        delete root.dataset.highlightedValue;
      }
      sections.forEach((section) => {
        const group = createElement('ul', 'sui-select-option__group');
        if (section.title) {
          group.appendChild(createElement('li', 'sui-select-option__group-title', section.title));
        }
        section.options.forEach((optionText, optionIndex) => {
          const li = document.createElement('li');
          const option = createElement('button', 'sui-select-option', optionText);
          option.type = 'button';
          option.dataset.selectValue = optionText;
          option.setAttribute('role', 'option');
          if (!root.dataset.highlightedValue && optionIndex === 0) {
            root.dataset.highlightedValue = optionText;
            option.classList.add('highlighted');
          } else if (root.dataset.highlightedValue === optionText) {
            option.classList.add('highlighted');
          }
          option.addEventListener('mousedown', (event) => {
            event.preventDefault();
            commitSheinShellField(root, optionText);
          });
          option.addEventListener('click', (event) => {
            event.preventDefault();
            commitSheinShellField(root, optionText);
          });
          li.appendChild(option);
          group.appendChild(li);
        });
        menu.appendChild(group);
      });
      state.popover.appendChild(menu);
    }

    function focusSheinFieldOption(root, direction) {
      const options = Array.from(root.querySelectorAll('.sui-select-option'));
      if (!options.length) {
        return;
      }
      const currentValue = root.dataset.highlightedValue || '';
      const currentIndex = Math.max(0, options.findIndex((entry) => entry.dataset.selectValue === currentValue));
      const nextIndex = direction > 0
        ? Math.min(options.length - 1, currentIndex + 1)
        : Math.max(0, currentIndex - 1);
      options.forEach((option, index) => {
        option.classList.toggle('highlighted', index === nextIndex);
      });
      root.dataset.highlightedValue = options[nextIndex].dataset.selectValue || '';
      options[nextIndex].scrollIntoView({ block: 'nearest' });
    }

    function moveCaretToEnd(input) {
      if (!input || typeof input.focus !== 'function') {
        return;
      }
      input.focus();
      if (typeof input.value !== 'string') {
        return;
      }
      const length = input.value.length;
      if (typeof input.setSelectionRange === 'function') {
        input.setSelectionRange(length, length);
      }
    }

    function bindSheinShellLiveInput(root, state, liveInput) {
      if (!liveInput || liveInput.dataset.sheinBound === 'true') {
        return;
      }
      liveInput.dataset.sheinBound = 'true';
      liveInput.addEventListener('input', () => {
        updateSheinShellValidation(root, liveInput.value || '');
        if (state.field.commitMode === 'option-only') {
          renderSheinFieldMenu(root, liveInput.value || '');
          state.popover.hidden = false;
        }
        scheduleTaskStateReport();
      });
      liveInput.addEventListener('keydown', (event) => {
        if (state.field.commitMode === 'option-only' && event.key === 'ArrowDown') {
          event.preventDefault();
          focusSheinFieldOption(root, 1);
          return;
        }
        if (state.field.commitMode === 'option-only' && event.key === 'ArrowUp') {
          event.preventDefault();
          focusSheinFieldOption(root, -1);
          return;
        }
        if (event.key === 'Enter') {
          event.preventDefault();
          commitSheinShellField(root, root.dataset.highlightedValue || null);
          return;
        }
        if (event.key === 'Escape') {
          event.preventDefault();
          closeSheinShellField(root);
          state.shell.focus();
        }
      });
      liveInput.addEventListener('blur', () => {
        if (state.suppressBlurCommit) {
          state.suppressBlurCommit = false;
          return;
        }
        state.blurTimer = window.setTimeout(() => {
          commitSheinShellField(root, null);
        }, 120);
      });
    }

    function closeSheinShellField(root) {
      const state = sheinShellFieldState.get(root);
      if (!state) {
        return;
      }
      if (state.blurTimer) {
        clearTimeout(state.blurTimer);
        state.blurTimer = null;
      }
      state.popover.hidden = true;
      state.shell.setAttribute('aria-expanded', 'false');
      state.displayInput.hidden = false;
      state.suppressBlurCommit = true;
      if (state.liveInput === state.displayInput) {
        state.displayInput.readOnly = true;
        state.displayInput.setAttribute('readonly', '');
        state.displayInput.setAttribute('aria-expanded', 'false');
      } else if (state.liveInput && state.liveInput.isConnected) {
        state.liveInput.remove();
      }
      state.liveInput = null;
      root.classList.remove('is-open');
      delete root.dataset.highlightedValue;
      syncInteractivePopoverBlocker();
      recordDebugEvent('shein-shell-close', {
        fieldId: state.field.id,
      });
    }

    function commitSheinShellField(root, optionText = null) {
      const state = sheinShellFieldState.get(root);
      if (!state) {
        return false;
      }
      const liveValue = state.liveInput ? state.liveInput.value : '';
      let nextValue = optionText == null ? liveValue : String(optionText);
      if (state.field.commitMode === 'option-only') {
        const validOptions = resolveSheinFieldOptions(state.field).flatMap((section) => section.options);
        if (!validOptions.includes(nextValue)) {
          if (validOptions.includes(liveValue)) {
            nextValue = liveValue;
          } else {
            nextValue = state.hiddenInput.value || '';
          }
        }
      }
      setFieldCommittedValue(state.field.id, nextValue, { source: optionText == null ? 'shein-shell-live' : 'shein-shell-option' });
      recordDebugEvent('shein-shell-commit', {
        fieldId: state.field.id,
        optionText: optionText == null ? null : String(optionText),
        committedValue: truncateDebugText(nextValue),
        previousValue: truncateDebugText(state.hiddenInput.value || ''),
      });
      closeSheinShellField(root);
      scheduleTaskStateReport();
      return true;
    }

    function openSheinShellField(root) {
      const state = sheinShellFieldState.get(root);
      if (!state || state.interactive === false) {
        return;
      }
      if (root.classList.contains('is-open') && state.liveInput) {
        moveCaretToEnd(state.liveInput);
        return;
      }
      commitAllInteractiveControls();
      state.shell.setAttribute('aria-expanded', 'true');
      root.classList.add('is-open');
      if (state.inlineEditor) {
        state.liveInput = state.displayInput;
        state.displayInput.hidden = false;
        state.displayInput.readOnly = false;
        state.displayInput.removeAttribute('readonly');
        state.displayInput.setAttribute('aria-expanded', 'true');
        bindSheinShellLiveInput(root, state, state.displayInput);
      } else if (!state.liveInput || !state.liveInput.isConnected) {
        const liveTag = state.field.liveTag === 'textarea' ? 'textarea' : 'input';
        const liveInput = document.createElement(liveTag);
        if (liveTag === 'input') {
          liveInput.type = normalizeInputType(state.field.type);
        } else {
          liveInput.rows = state.field.rows || 3;
        }
        liveInput.className = liveTag === 'textarea'
          ? 'sui-textarea-title__inner addr-input__title sui-shell__live'
          : 'sui-input-title__inner sui-input-title__inner-border sui-input-title__inner-suffix addr-input__title sui-shell__live';
        liveInput.value = state.hiddenInput.value || '';
        liveInput.placeholder = root.classList.contains('compact-shell')
          ? `${state.field.label}${state.field.required ? '*' : ''}`
          : state.placeholder;
        applyFieldSemantics(liveInput, state.field, state.field.label, 'live');
        if (state.field.commitMode === 'option-only') {
          liveInput.setAttribute('role', 'combobox');
          liveInput.setAttribute('aria-autocomplete', 'list');
          liveInput.setAttribute('aria-controls', state.field.ariaControls || 'associate-listbox');
          liveInput.setAttribute('aria-expanded', 'true');
        }
        bindSheinShellLiveInput(root, state, liveInput);
        state.liveInput = liveInput;
      }
      if (!state.inlineEditor) {
        state.displayInput.hidden = true;
        const shellSuffix = state.shell.querySelector('.sui-input-title__suffix, .sui-textarea-title__limit');
        insertEditorBeforeReference(state.shell, state.liveInput, shellSuffix);
      }
      if (state.field.commitMode === 'option-only') {
        renderSheinFieldMenu(root, state.liveInput.value || '');
        state.popover.hidden = false;
      } else {
        state.popover.hidden = true;
      }
      syncInteractivePopoverBlocker();
      recordDebugEvent('shein-shell-open', {
        fieldId: state.field.id,
        commitMode: state.field.commitMode || 'free-text',
      });
      requestAnimationFrame(() => {
        moveCaretToEnd(state.liveInput);
      });
    }

    function updateSheinAddressFinder(root, query) {
      const state = sheinAddressFinderState.get(root);
      if (!state) {
        return;
      }
      const normalizedQuery = String(query || '').trim().toLowerCase();
      const results = (state.field.autocompleteOptions || []).filter((option) => {
        const label = typeof option === 'string' ? option : option.label;
        if (!normalizedQuery) {
          return true;
        }
        return String(label).toLowerCase().includes(normalizedQuery);
      });
      state.resultList.innerHTML = '';
      if (results.length === 0) {
        state.resultList.appendChild(createElement('li', 'checkout-empty-state', 'No addresses match the current query.'));
        return;
      }
      results.forEach((option, index) => {
        const label = typeof option === 'string' ? option : option.label;
        const item = document.createElement('li');
        const button = createElement('button', `sui-address-option${index === 0 ? ' highlighted' : ''}`, label);
        button.type = 'button';
        button.dataset.optionValue = label;
        button.addEventListener('mousedown', (event) => {
          event.preventDefault();
          commitSheinAddressFinder(root, option);
        });
        button.addEventListener('click', (event) => {
          event.preventDefault();
          commitSheinAddressFinder(root, option);
        });
        item.appendChild(button);
        state.resultList.appendChild(item);
      });
    }

    function closeSheinAddressFinder(root) {
      const state = sheinAddressFinderState.get(root);
      if (!state) {
        return;
      }
      if (state.blurTimer) {
        clearTimeout(state.blurTimer);
        state.blurTimer = null;
      }
      state.overlay.hidden = true;
      state.popover.hidden = true;
      state.shell.setAttribute('aria-expanded', 'false');
      if (state.liveInput && state.liveInput.isConnected) {
        state.draftValue = state.liveInput.value || '';
      }
      const displayValue = state.hiddenInput.value || state.draftValue || '';
      state.displayInput.value = displayValue;
      state.shell.classList.toggle('placeholder', String(displayValue).trim().length === 0);
      state.displayInput.hidden = false;
      if (state.liveInput && state.liveInput.isConnected) {
        state.liveInput.remove();
      }
      root.classList.remove('is-open');
      syncInteractivePopoverBlocker();
      recordDebugEvent('address-finder-close', {
        fieldId: state.field.id,
      });
    }

    function commitSheinAddressFinder(root, option) {
      const state = sheinAddressFinderState.get(root);
      if (!state) {
        return false;
      }
      const label = typeof option === 'string' ? option : option.label;
      const previousValue = state.hiddenInput.value || '';
      state.hiddenInput.value = label;
      state.draftValue = label;
      state.displayInput.value = label;
      state.shell.classList.toggle('placeholder', String(label).trim().length === 0);
      if (option && typeof option === 'object' && option.fills) {
        Object.entries(option.fills).forEach(([fieldId, value]) => {
          setFieldCommittedValue(fieldId, value, { source: 'address-finder-fill' });
        });
      }
      recordDebugEvent('address-finder-commit', {
        fieldId: state.field.id,
        selectedValue: truncateDebugText(label),
        previousValue: truncateDebugText(previousValue),
        fills: option && typeof option === 'object' && option.fills ? option.fills : undefined,
      });
      closeSheinAddressFinder(root);
      scheduleTaskStateReport();
      return true;
    }

    function openSheinAddressFinder(root) {
      const state = sheinAddressFinderState.get(root);
      if (!state) {
        return;
      }
      if (root.classList.contains('is-open') && state.liveInput) {
        moveCaretToEnd(state.liveInput);
        return;
      }
      commitAllInteractiveControls();
      state.shell.setAttribute('aria-expanded', 'true');
      root.classList.add('is-open');
      if (!state.liveInput || !state.liveInput.isConnected) {
        const liveInput = document.createElement('input');
        liveInput.type = 'text';
        liveInput.className = 'addr-search-content__core sui-input__inner sui-shell__live';
        liveInput.value = state.hiddenInput.value || '';
        liveInput.placeholder = state.field.placeholder || '';
        liveInput.setAttribute('role', 'combobox');
        liveInput.setAttribute('aria-autocomplete', 'list');
        liveInput.setAttribute('aria-controls', state.field.ariaControls || 'associate-listbox');
        liveInput.setAttribute('aria-expanded', 'true');
        applyFieldSemantics(liveInput, state.field, state.field.label, 'live');
        liveInput.addEventListener('input', () => {
          state.draftValue = liveInput.value || '';
          updateSheinAddressFinder(root, liveInput.value || '');
          scheduleTaskStateReport();
        });
        liveInput.addEventListener('keydown', (event) => {
          if (event.key === 'Enter') {
            const topResult = state.resultList.querySelector('.sui-address-option');
            if (topResult) {
              event.preventDefault();
              const selected = (state.field.autocompleteOptions || []).find((option) => {
                const label = typeof option === 'string' ? option : option.label;
                return label === topResult.dataset.optionValue;
              });
              if (selected) {
                commitSheinAddressFinder(root, selected);
              }
            }
            return;
          }
          if (event.key === 'Escape') {
            event.preventDefault();
            closeSheinAddressFinder(root);
            state.shell.focus();
          }
        });
        liveInput.addEventListener('blur', () => {
          if (DEBUG_OPEN_FIELD === 'address-finder') {
            return;
          }
          state.blurTimer = window.setTimeout(() => {
            closeSheinAddressFinder(root);
            scheduleTaskStateReport();
          }, 120);
        });
        state.liveInput = liveInput;
      }
      if (state.draftValue && !state.hiddenInput.value) {
        state.liveInput.value = state.draftValue;
      }
      state.displayInput.hidden = true;
      const shellSuffix = state.shell.querySelector('.sui-input__suffix');
      insertEditorBeforeReference(state.shell, state.liveInput, shellSuffix);
      state.overlay.hidden = false;
      state.overlay.replaceChildren(state.popover);
      state.popover.hidden = false;
      updateSheinAddressFinder(root, state.liveInput.value || '');
      syncInteractivePopoverBlocker();
      recordDebugEvent('address-finder-open', {
        fieldId: state.field.id,
      });
      requestAnimationFrame(() => {
        moveCaretToEnd(state.liveInput);
      });
    }

    function closeAllInteractiveControls(exceptRoot = null) {
      closeAllCustomSelects(exceptRoot);
      checkoutComboboxState.forEach((state, root) => {
        if (root !== exceptRoot) {
          closeCheckoutCombobox(root);
        }
      });
      checkoutAddressState.forEach((state, root) => {
        if (root !== exceptRoot) {
          closeCheckoutAutocomplete(root);
        }
      });
      sheinShellFieldState.forEach((state, root) => {
        if (root !== exceptRoot) {
          closeSheinShellField(root);
        }
      });
      sheinAddressFinderState.forEach((state, root) => {
        if (root !== exceptRoot) {
          closeSheinAddressFinder(root);
        }
      });
    }

    function commitAllInteractiveControls() {
      closeAllCustomSelects();

      checkoutComboboxState.forEach((state, root) => {
        if (state.input && state.input.isConnected) {
          const candidateValue = root.dataset.highlightedValue || state.input.value || state.hiddenInput.value || '';
          if (!commitCheckoutCombobox(root, candidateValue)) {
            closeCheckoutCombobox(root);
          }
          return;
        }
        closeCheckoutCombobox(root);
      });

      checkoutAddressState.forEach((state, root) => {
        closeCheckoutAutocomplete(root);
      });

      sheinShellFieldState.forEach((state, root) => {
        if (state.liveInput && state.liveInput.isConnected) {
          if (state.field.commitMode !== 'option-only') {
            const liveValue = String(state.liveInput.value || '');
            state.hiddenInput.value = liveValue;
            setSheinDisplayValue(state, liveValue);
            closeSheinShellField(root);
            scheduleTaskStateReport();
            return;
          }
          commitSheinShellField(root, null);
          return;
        }
        closeSheinShellField(root);
      });

      sheinAddressFinderState.forEach((state, root) => {
        if (state.liveInput && state.liveInput.isConnected) {
          closeSheinAddressFinder(root);
          scheduleTaskStateReport();
          return;
        }
        closeSheinAddressFinder(root);
      });
    }

    function getCommittedFieldValue(fieldId) {
      const fieldRoot = appRoot.querySelector(`.form-field[data-form-field-id="${fieldId}"]`);
      if (!fieldRoot) {
        return '';
      }
      const input = fieldRoot.querySelector(`input[type="hidden"][name="${fieldId}"], input[type="hidden"]#${fieldId}`);
      if (input) {
        return input.value || '';
      }
      return getFieldValue(fieldRoot);
    }

    function resolveDynamicOptions(field) {
      if (Array.isArray(field.options) && field.options.length > 0) {
        return field.options;
      }
      if (!field.optionGroups) {
        return [];
      }
      const dependencyValue = getCommittedFieldValue(field.dependsOn);
      return Array.isArray(field.optionGroups[dependencyValue]) ? field.optionGroups[dependencyValue] : [];
    }

    function clearDependentCheckoutFields(parentFieldId) {
      checkoutComboboxState.forEach((state, root) => {
        if (state.field.dependsOn !== parentFieldId) {
          return;
        }
        state.hiddenInput.value = '';
        state.displayValue.textContent = state.placeholder;
        state.shell.classList.add('placeholder');
        if (state.input && state.input.isConnected) {
          state.input.value = '';
          renderCheckoutComboboxOptions(root, '');
        }
        clearDependentCheckoutFields(state.field.id);
      });
      sheinShellFieldState.forEach((state, root) => {
        if (state.field.dependsOn !== parentFieldId) {
          return;
        }
        state.hiddenInput.value = '';
        setSheinDisplayValue(state, '');
        if (state.liveInput && state.liveInput.isConnected) {
          state.liveInput.value = '';
          renderSheinFieldMenu(root, '');
        }
        clearDependentCheckoutFields(state.field.id);
      });
    }

    function updateCheckoutAddressSuggestions(root, query) {
      const state = checkoutAddressState.get(root);
      if (!state) {
        return;
      }
      const normalizedQuery = String(query || '').trim().toLowerCase();
      const options = (state.field.autocompleteOptions || []).filter((option) => {
        if (!normalizedQuery) {
          return true;
        }
        return option.toLowerCase().includes(normalizedQuery);
      });
      state.popover.innerHTML = '';
      if (options.length === 0) {
        state.popover.appendChild(createElement('div', 'checkout-empty-state', 'No suggestions match the current address text.'));
        recordDebugEvent('checkout-address-suggestions', {
          fieldId: state.field.id,
          query: truncateDebugText(query),
          optionCount: 0,
        });
        return;
      }
      options.forEach((optionText, index) => {
        const option = createElement('button', `checkout-autocomplete-option${index === 0 ? ' highlighted' : ''}`, optionText);
        option.type = 'button';
        option.dataset.optionValue = optionText;
        option.addEventListener('mousedown', (event) => {
          event.preventDefault();
          commitCheckoutAddress(root, optionText);
        });
        option.addEventListener('click', (event) => {
          event.preventDefault();
          commitCheckoutAddress(root, optionText);
        });
        state.popover.appendChild(option);
      });
      recordDebugEvent('checkout-address-suggestions', {
        fieldId: state.field.id,
        query: truncateDebugText(query),
        optionCount: options.length,
        options: options.slice(0, 5),
      });
    }

    function openCheckoutAutocomplete(root) {
      const state = checkoutAddressState.get(root);
      if (!state) {
        return;
      }
      closeAllInteractiveControls(root);
      state.popover.hidden = false;
      state.input.setAttribute('aria-expanded', 'true');
      updateCheckoutAddressSuggestions(root, state.input.value || '');
      recordDebugEvent('checkout-address-open', {
        fieldId: state.field.id,
      });
    }

    function closeCheckoutAutocomplete(root) {
      const state = checkoutAddressState.get(root);
      if (!state) {
        return;
      }
      state.popover.hidden = true;
      state.input.setAttribute('aria-expanded', 'false');
      recordDebugEvent('checkout-address-close', {
        fieldId: state.field.id,
      });
    }

    function commitCheckoutAddress(root, value) {
      const state = checkoutAddressState.get(root);
      if (!state) {
        return false;
      }
      state.input.value = value;
      recordDebugEvent('checkout-address-commit', {
        fieldId: state.field.id,
        committedValue: truncateDebugText(value),
      });
      closeCheckoutAutocomplete(root);
      scheduleTaskStateReport();
      return true;
    }

    function renderCheckoutComboboxOptions(root, filterText = '') {
      const state = checkoutComboboxState.get(root);
      if (!state) {
        return;
      }
      const normalizedFilter = String(filterText || '').trim().toLowerCase();
      const options = resolveDynamicOptions(state.field).filter((optionText) => {
        if (!normalizedFilter) {
          return true;
        }
        return optionText.toLowerCase().includes(normalizedFilter);
      });
      state.popover.innerHTML = '';
      if (options.length === 0) {
        const emptyMessage = state.field.dependsOn && !getCommittedFieldValue(state.field.dependsOn)
          ? 'Choose the previous field first.'
          : 'No matching options.';
        state.popover.appendChild(createElement('div', 'checkout-empty-state', emptyMessage));
        delete root.dataset.highlightedValue;
        return;
      }
      options.forEach((optionText, index) => {
        const option = createElement('button', `checkout-option${index === 0 ? ' highlighted' : ''}`, optionText);
        option.type = 'button';
        option.dataset.selectValue = optionText;
        option.setAttribute('role', 'option');
        option.setAttribute('aria-selected', index === 0 ? 'true' : 'false');
        option.addEventListener('mousedown', (event) => {
          event.preventDefault();
          commitCheckoutCombobox(root, optionText);
        });
        option.addEventListener('click', (event) => {
          event.preventDefault();
          commitCheckoutCombobox(root, optionText);
        });
        state.popover.appendChild(option);
      });
      root.dataset.highlightedValue = options[0];
    }

    function focusCheckoutComboboxOption(root, direction) {
      const options = Array.from(root.querySelectorAll('.checkout-option'));
      if (!options.length) {
        return;
      }
      const currentValue = root.dataset.highlightedValue || '';
      const currentIndex = Math.max(0, options.findIndex((entry) => entry.dataset.selectValue === currentValue));
      const nextIndex = direction > 0
        ? Math.min(options.length - 1, currentIndex + 1)
        : Math.max(0, currentIndex - 1);
      options.forEach((option, index) => {
        const active = index === nextIndex;
        option.classList.toggle('highlighted', active);
        option.setAttribute('aria-selected', active ? 'true' : 'false');
      });
      root.dataset.highlightedValue = options[nextIndex].dataset.selectValue || '';
      options[nextIndex].scrollIntoView({ block: 'nearest' });
    }

    function closeCheckoutCombobox(root) {
      const state = checkoutComboboxState.get(root);
      if (!state) {
        return;
      }
      if (state.blurTimer) {
        clearTimeout(state.blurTimer);
        state.blurTimer = null;
      }
      state.popover.hidden = true;
      state.shell.hidden = false;
      state.shell.setAttribute('aria-expanded', 'false');
      root.classList.remove('editing');
      if (state.input && state.input.isConnected) {
        state.input.remove();
      }
      delete root.dataset.highlightedValue;
      recordDebugEvent('checkout-combobox-close', {
        fieldId: state.field.id,
      });
    }

    function openCheckoutCombobox(root) {
      const state = checkoutComboboxState.get(root);
      if (!state) {
        return;
      }
      if (root.classList.contains('editing') && state.input) {
        state.input.focus();
        return;
      }
      commitAllInteractiveControls();
      root.classList.add('editing');
      state.shell.hidden = true;
      state.shell.setAttribute('aria-expanded', 'true');
      if (!state.input || !state.input.isConnected) {
        const input = document.createElement('input');
        input.type = 'text';
        input.className = 'checkout-edit-input';
        input.value = state.hiddenInput.value || '';
        input.placeholder = state.placeholder;
        input.dataset.fieldId = state.field.id;
        input.setAttribute('role', 'searchbox');
        input.setAttribute('aria-autocomplete', 'list');
        input.setAttribute('aria-expanded', 'true');
        applyFieldSemantics(input, state.field, state.field.label, 'live');
        input.addEventListener('input', () => {
          renderCheckoutComboboxOptions(root, input.value || '');
          scheduleTaskStateReport();
        });
        input.addEventListener('keydown', (event) => {
          if (event.key === 'ArrowDown') {
            event.preventDefault();
            focusCheckoutComboboxOption(root, 1);
            return;
          }
          if (event.key === 'ArrowUp') {
            event.preventDefault();
            focusCheckoutComboboxOption(root, -1);
            return;
          }
          if (event.key === 'Enter') {
            event.preventDefault();
            const activeValue = root.dataset.highlightedValue || '';
            const fallbackValue = input.value || '';
            commitCheckoutCombobox(root, activeValue || fallbackValue);
            return;
          }
          if (event.key === 'Escape') {
            event.preventDefault();
            closeCheckoutCombobox(root);
            state.shell.focus();
          }
        });
        input.addEventListener('blur', () => {
          state.blurTimer = window.setTimeout(() => {
            closeCheckoutCombobox(root);
            scheduleTaskStateReport();
          }, 120);
        });
        state.input = input;
      }
      root.insertBefore(state.input, state.popover);
      state.popover.hidden = false;
      renderCheckoutComboboxOptions(root, state.input.value || '');
      recordDebugEvent('checkout-combobox-open', {
        fieldId: state.field.id,
      });
      requestAnimationFrame(() => {
        state.input.focus();
        state.input.select();
      });
    }

    function commitCheckoutCombobox(root, optionText) {
      const state = checkoutComboboxState.get(root);
      if (!state) {
        return false;
      }
      const normalizedValue = String(optionText || '').trim();
      const availableOptions = resolveDynamicOptions(state.field);
      if (!normalizedValue || !availableOptions.includes(normalizedValue)) {
        recordDebugEvent('checkout-combobox-commit-rejected', {
          fieldId: state.field.id,
          attemptedValue: truncateDebugText(optionText),
          availableOptions: availableOptions.slice(0, 8),
        });
        return false;
      }
      const previousValue = state.hiddenInput.value || '';
      state.hiddenInput.value = normalizedValue;
      state.displayValue.textContent = normalizedValue;
      state.shell.classList.remove('placeholder');
      if (state.input && state.input.isConnected) {
        state.input.value = normalizedValue;
      }
      closeCheckoutCombobox(root);
      if (previousValue !== normalizedValue) {
        clearDependentCheckoutFields(state.field.id);
      }
      recordDebugEvent('checkout-combobox-commit', {
        fieldId: state.field.id,
        previousValue: truncateDebugText(previousValue),
        committedValue: truncateDebugText(normalizedValue),
      });
      scheduleTaskStateReport();
      return true;
    }

    function captureTaskState(config) {
      const values = {};
      const visibleFieldIds = [];
      const visibleRequiredFieldIds = [];
      const fields = appRoot.querySelectorAll('.form-field[data-form-field-id]');

      fields.forEach((field) => {
        const fieldId = field.dataset.formFieldId;
        if (!fieldId) {
          return;
        }

        if (isVisible(field)) {
          visibleFieldIds.push(fieldId);
          if (field.dataset.required === 'true') {
            visibleRequiredFieldIds.push(fieldId);
          }
        }

        const shellRoot = field.querySelector('.sui-shell-field-root');
        if (shellRoot) {
          const state = sheinShellFieldState.get(shellRoot);
          if (state) {
            const inputFieldId = state.hiddenInput.getAttribute('name') || state.hiddenInput.id || fieldId;
            if (!Object.prototype.hasOwnProperty.call(values, inputFieldId)) {
              const liveValue = state.liveInput && state.liveInput.isConnected
                ? state.liveInput.value || ''
                : '';
              values[inputFieldId] = liveValue || state.hiddenInput.value || '';
            }
            return;
          }
        }

        const addressFinderRoot = field.querySelector('.sui-address-finder-root');
        if (addressFinderRoot) {
          const state = sheinAddressFinderState.get(addressFinderRoot);
          if (state) {
            const inputFieldId = state.hiddenInput.getAttribute('name') || state.hiddenInput.id || fieldId;
            if (!Object.prototype.hasOwnProperty.call(values, inputFieldId)) {
              const liveValue = state.liveInput && state.liveInput.isConnected
                ? state.liveInput.value || ''
                : '';
              values[inputFieldId] = liveValue || state.hiddenInput.value || '';
            }
            return;
          }
        }

        const firstInput = field.querySelector('input, textarea, select');
        if (!firstInput) {
          return;
        }

        const inputFieldId = firstInput.getAttribute('name') || firstInput.id;
        if (!inputFieldId || Object.prototype.hasOwnProperty.call(values, inputFieldId)) {
          return;
        }

        if (firstInput instanceof HTMLInputElement && firstInput.type === 'radio') {
          const checked = field.querySelector('input[type="radio"]:checked');
          values[inputFieldId] = checked ? checked.value : '';
          return;
        }

        if (firstInput instanceof HTMLInputElement && firstInput.type === 'checkbox') {
          values[inputFieldId] = Array.from(field.querySelectorAll('input[type="checkbox"]:checked')).map((input) => input.value);
          return;
        }

        values[inputFieldId] = firstInput.value || '';
      });

      const submitButton = document.querySelector('#primary-action');
      const successMessage = document.querySelector('[data-success-message="true"]');

      return {
        source: {
          visibleFieldIds: Array.from(new Set(config.benchmarkSession?.inlineSourceFieldIds || [])),
        },
        form: {
          values,
          visibleFieldIds: Array.from(new Set(visibleFieldIds)),
          visibleRequiredFieldIds: Array.from(new Set(visibleRequiredFieldIds)),
          submitVisible: submitButton ? isVisible(submitButton) : false,
          submitted: successMessage ? isVisible(successMessage) : false,
        },
        debug: capturePageDebugState(),
      };
    }

    async function performTaskStateReport() {
      if (!HARNESS_CONFIG.reportStateUrl || !currentRuntimeConfig || !currentSessionId) {
        return;
      }

      if (reportStateInFlight) {
        return;
      }

      reportStateInFlight = true;
      try {
        const pendingDebugEvents = formDebugEvents
          .filter((event) => event.seq > lastReportedDebugEventSeq)
          .slice(0, 200);
        const payload = JSON.stringify({
          sessionId: currentSessionId,
          stateRequestId: currentStateRequestId,
          taskState: captureTaskState(currentRuntimeConfig),
          pageDebugSnapshot: capturePageDebugState(),
          pageDebugEvents: pendingDebugEvents,
        });
        let delivered = false;
        try {
          if (navigator.sendBeacon) {
            delivered = navigator.sendBeacon(
              HARNESS_CONFIG.reportStateUrl,
              new Blob([payload], { type: 'application/json' }),
            );
          }
        } catch {}

        if (!delivered) {
          await fetch(HARNESS_CONFIG.reportStateUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: payload,
          });
        }

        if (pendingDebugEvents.length > 0) {
          lastReportedDebugEventSeq = pendingDebugEvents[pendingDebugEvents.length - 1].seq;
        }
      } catch (error) {
        reportPageError('performTaskStateReport', error);
      } finally {
        reportStateInFlight = false;
      }
    }

    function scheduleTaskStateReport(delayMs = 30) {
      if (!HARNESS_CONFIG.reportStateUrl || !currentRuntimeConfig || !currentSessionId) {
        return;
      }

      if (reportStateTimer !== null) {
        clearTimeout(reportStateTimer);
        reportStateTimer = null;
      }

      if (delayMs <= 0) {
        if (reportStateMicrotaskQueued) {
          return;
        }
        reportStateMicrotaskQueued = true;
        queueMicrotask(() => {
          reportStateMicrotaskQueued = false;
          void performTaskStateReport();
        });
        return;
      }

      reportStateTimer = window.setTimeout(() => {
        reportStateTimer = null;
        void performTaskStateReport();
      }, delayMs);
    }

    function scheduleTaskStateReportBurst() {
      scheduleTaskStateReport(0);
      window.setTimeout(() => scheduleTaskStateReport(0), 120);
      window.setTimeout(() => scheduleTaskStateReport(0), 450);
      window.setTimeout(() => scheduleTaskStateReport(0), 1200);
    }

    function renderField(field, selectVariant) {
      const fieldDiv = createElement('div', 'form-field');
      const useSheinCheckoutMarkup = currentRuntimeConfig?.surface?.family === 'checkout-shipping-ax-trap';
      fieldDiv.dataset.formFieldId = field.id;
      fieldDiv.dataset.required = field.required ? 'true' : 'false';
      if (field.fullWidth || field.type === 'radio' || field.type === 'checkbox' || field.type === 'textarea') {
        fieldDiv.classList.add('full-width');
      }

      if (useSheinCheckoutMarkup) {
        fieldDiv.classList.add('addr-field', field.fullWidth || field.type === 'textarea' ? 'grid-col-12' : 'grid-col-6');
        fieldDiv.dataset.fieldName = field.id.replace(/^input-/, '');
        if (
          field.controlVariant === 'shein-static-select'
          || field.controlVariant === 'shein-address-finder'
          || field.id === 'input-state'
        ) {
          fieldDiv.classList.add('addr-select-area');
        } else {
          fieldDiv.classList.add('addr-input');
        }
      } else {
        const label = document.createElement('label');
        label.htmlFor = field.id;
        label.appendChild(document.createTextNode(field.label));
        if (field.required) {
          label.appendChild(document.createTextNode(' '));
          label.appendChild(createElement('span', 'required-indicator', '*'));
        }
        fieldDiv.appendChild(label);

        if (field.caption) {
          fieldDiv.appendChild(createElement('div', 'field-caption', field.caption));
        }
      }

      let inputEl;
      if (field.controlVariant === 'shein-static-select') {
        const root = createElement('div', 'sui-shell-field-root');
        root.dataset.fieldId = field.id;
        const useCompactShell = field.liveTag !== 'textarea';
        if (useCompactShell) {
          root.classList.add('compact-shell');
        }

        inputEl = document.createElement('input');
        inputEl.type = 'hidden';
        inputEl.id = field.id;
        inputEl.name = field.id;
        inputEl.dataset.fieldId = field.id;
        applyFieldSemantics(inputEl, field, field.label, 'hidden');
        root.appendChild(inputEl);

        const shell = createElement('div', 'sui-select addr-select-area__core select-readonly');
        const trigger = createElement('div', 'sui-select__trigger sui-select__trigger-readonly');
        const titleWrap = createElement('div', 'sui-input-titlewarp');
        titleWrap.setAttribute('role', 'combobox');
        titleWrap.setAttribute('aria-haspopup', 'listbox');
        titleWrap.setAttribute('aria-expanded', 'false');
        titleWrap.setAttribute('aria-label', field.label);
        const title = createElement('div', 'sui-input-title');
        const titleBody = createElement('div', 'sui-input-title__bd');

        }

        if (field.controlVariant === 'shein-shell-field' || field.controlVariant === 'shein-static-select' || field.controlVariant === 'shein-address-finder') {
          setFieldCommittedValue(fieldId, String(rawValue), { skipDependents: true, source: 'bootstrap' });
          return;
        }

        if (field.controlVariant === 'checkout-transient-combobox') {
          const hiddenInput = fieldRoot.querySelector(`input[type="hidden"][name="${fieldId}"]`);
          const root = fieldRoot.querySelector('.checkout-combobox-root');
          const state = root ? checkoutComboboxState.get(root) : null;
          if (hiddenInput && state) {
            hiddenInput.value = String(rawValue);
            state.displayValue.textContent = String(rawValue);
            state.shell.classList.toggle('placeholder', String(rawValue).trim().length === 0);
          }
          return;
        }

        if (field.controlVariant === 'checkout-address-autocomplete') {
          const input = fieldRoot.querySelector('input[type="text"]');
          if (input) {
            input.value = String(rawValue);
          }
          return;
        }

        if (field.type === 'select' && config.selectVariant === 'web') {
          const selectRoot = fieldRoot.querySelector('.custom-select');
          if (selectRoot) {
            selectCustomOption(selectRoot, String(rawValue));
          }
          return;
        }

        if (field.type === 'select') {
          const input = fieldRoot.querySelector('select');
          if (input) {
            input.value = String(rawValue);
          }
          return;
        }

        if (field.type === 'radio') {
          const radio = fieldRoot.querySelector(`input[type="radio"][value="${String(rawValue).replace(/"/g, '&quot;')}"]`);
          if (radio) {
            radio.checked = true;
          }
          return;
        }

        if (field.type === 'checkbox') {
          const values = Array.isArray(rawValue) ? rawValue.map(String) : [String(rawValue)];
          fieldRoot.querySelectorAll('input[type="checkbox"]').forEach((input) => {
            input.checked = values.includes(input.value);
          });
          return;
        }

        const input = fieldRoot.querySelector('input, textarea');
        if (input) {
          input.value = String(rawValue);
          input.dispatchEvent(new Event('input', { bubbles: true }));
        }
      });
    }

    function getBenchmarkSourceLines(documentConfig) {
      if (!documentConfig) {
        return [];
      }

      if (Array.isArray(documentConfig.summaryLines) && documentConfig.summaryLines.length > 0) {
        return documentConfig.summaryLines.map((line) => String(line || '').trim()).filter(Boolean);
      }

      const lines = [];
      (documentConfig.meta || []).forEach((item) => {
        if (!item || !item.label) {
          return;
        }
        lines.push(`${item.label}: ${item.value || ''}`.trim());
      });
      (documentConfig.sections || []).forEach((section) => {
        (section.items || []).forEach((entry) => {
          if (!entry) {
            return;
          }
          if (entry.type === 'fact') {
            lines.push(`${entry.label}: ${entry.value || ''}`.trim());
            return;
          }
          if (entry.text) {
            lines.push(String(entry.text).trim());
          }
        });
      });
      return lines.filter(Boolean);
    }

    function renderBenchmarkSourcePane(config) {
      const sourceDocument = config.benchmarkSession?.sourceDocument;
      if (!sourceDocument) {
        return null;
      }

      const sourceSurface = config.benchmarkSession?.sourceSurface || {};
      const pane = createElement('aside', 'benchmark-source-pane');
      const appRow = createElement('div', 'source-app-row');
      appRow.appendChild(createElement('div', 'source-app-name', sourceSurface.productName || 'Source'));
      if (sourceSurface.workspaceLabel) {
        appRow.appendChild(createElement('div', 'source-workspace', sourceSurface.workspaceLabel));
      }
      pane.appendChild(appRow);

      const card = createElement('section', 'benchmark-source-card');
      card.appendChild(createElement('div', 'benchmark-source-title', sourceDocument.title || 'Source document'));
      if (sourceDocument.subtitle) {
        card.appendChild(createElement('div', 'benchmark-source-subtitle', sourceDocument.subtitle));
      }
      if (sourceSurface.activeFilter) {
        card.appendChild(createElement('div', 'benchmark-source-pill', sourceSurface.activeFilter));
      }
      pane.appendChild(card);

      const details = createElement('section', 'benchmark-source-section');
      details.appendChild(createElement('div', 'benchmark-source-section-title', 'Briefing'));
      getBenchmarkSourceLines(sourceDocument).forEach((line) => {
        details.appendChild(createElement('div', 'benchmark-source-line', line));
      });
      pane.appendChild(details);

      return pane;
    }

        brandRow.appendChild(createElement('div', 'checkout-brand-mark', 'SHEIN'));

          perks.appendChild(createElement('span', '', copy));
        });
        siteHeader.appendChild(perks);
        main.appendChild(siteHeader);

        const progress = createElement('div', 'checkout-progress');
        progress.appendChild(createElement('span', '', 'Cart'));
        progress.appendChild(createElement('span', '', '>'));
        progress.appendChild(createElement('span', 'current', 'Place Order'));
        progress.appendChild(createElement('span', '', '>'));
        progress.appendChild(createElement('span', '', 'Pay'));
        progress.appendChild(createElement('span', '', '>'));
        progress.appendChild(createElement('span', '', 'Order Complete'));

      }

      if (isExpenseRegression) {
        const shellHeader = createElement('div', 'expense-shell-header');
        const shellCopy = createElement('div', 'expense-shell-copy');
        shellCopy.appendChild(createElement('div', 'expense-shell-kicker', config.surface.workspaceLabel || 'Expense approvals'));
        shellCopy.appendChild(createElement('div', 'expense-shell-title', config.surface.productName || 'Expense report'));
        shellHeader.appendChild(shellCopy);

        const shellMeta = createElement('div', 'expense-shell-meta');
        shellMeta.appendChild(createElement('span', 'expense-chip accent', config.surface.status || 'Draft'));
        shellMeta.appendChild(createElement('span', 'expense-chip', 'Auto-saved'));
        shellMeta.appendChild(createElement('span', 'expense-chip', 'JS-heavy controls'));
        shellHeader.appendChild(shellMeta);
        main.appendChild(shellHeader);
      }

      const mainHeader = createElement('div', 'surface-header');
      mainHeader.appendChild(createElement('h1', 'surface-title', isCheckoutRegression ? 'Shipping Address' : config.title));
      if (!isCheckoutRegression) {
        mainHeader.appendChild(createElement(
          'p',
          'surface-copy',
          'Fill only what the pasted source supports.',
        ));

        const status = createElement('div', 'surface-meta');
        status.appendChild(createElement('span', 'meta-pill', config.surface.productName || 'Form'));
        if (config.hasSubmit) {
          status.appendChild(createElement('span', 'meta-pill', config.submitButtonText || config.surface.primaryAction || 'Submit'));
        }
        mainHeader.appendChild(status);
      }

      const scroll = createElement('div', 'surface-scroll');
      groupFields(config.fields).forEach((fields, sectionTitle) => {
        const section = createElement('section', 'section-card');
        section.appendChild(createElement('div', 'section-title', sectionTitle));
        const grid = createElement('div', `fields-grid${config.twoColumn ? ' two-column' : ''}`);
        fields.forEach((field) => {
          grid.appendChild(renderField(field, config.selectVariant));
        });
        section.appendChild(grid);
        scroll.appendChild(section);
      });

      if (config.hasSubmit) {
        const validationMessage = createElement('div', 'validation-message', 'Complete the required visible fields before continuing.');
        validationMessage.setAttribute('data-validation-message', 'true');
        scroll.appendChild(validationMessage);

        const successMessage = createElement('div', 'success-message', config.successMessage || 'Action completed successfully.');
        successMessage.setAttribute('data-success-message', 'true');
        scroll.appendChild(successMessage);

        const submitRow = createElement('div', 'submit-row');
        submitRow.appendChild(createElement('div', 'small-label', 'Submit once the visible required fields are correct.'));
        const submitButton = createElement('button', 'primary-button', config.submitButtonText || config.surface.primaryAction || 'Save');
        submitButton.id = 'primary-action';
        submitButton.type = 'button';
        submitButton.addEventListener('click', () => {
          commitAllInteractiveControls();
          if (!validateRequiredFields(main)) {
            scheduleTaskStateReportBurst();
            return;
          }
          validationMessage.style.display = 'none';
          successMessage.style.display = 'block';
          submitButton.disabled = true;
          successMessage.scrollIntoView({ block: 'nearest' });
          scheduleTaskStateReportBurst();
        });
        submitRow.appendChild(submitButton);
        scroll.appendChild(submitRow);
      }

      if (isCheckoutRegression) {
        const layout = createElement('div', 'checkout-layout');
        const mainColumn = createElement('div', 'checkout-main-column');
        mainColumn.appendChild(mainHeader);
        mainColumn.appendChild(scroll);
        layout.appendChild(mainColumn);
        layout.appendChild(renderCheckoutRegressionSidebar());
        main.appendChild(layout);
      } else if (isExpenseRegression) {
        const layout = createElement('div', 'expense-layout');
        const mainColumn = createElement('div', 'expense-main-column');
        mainColumn.appendChild(mainHeader);
        mainColumn.appendChild(scroll);
        layout.appendChild(mainColumn);
        layout.appendChild(renderExpenseSidebar(config));
        main.appendChild(layout);
      } else {
        main.appendChild(mainHeader);
        main.appendChild(scroll);
      }
      return main;
    }

    function renderExpenseSidebar(config) {
      const sidebar = createElement('aside', 'expense-sidebar');

      const scorecard = createElement('section', 'expense-card');
      scorecard.appendChild(createElement('h3', '', 'Report Health'));
      const summaryGrid = createElement('div', 'expense-summary-grid');
      [
        ['Fields', String((config.fields || []).length)],
        ['Required', String((config.fields || []).filter((field) => field.required).length)],
        ['Policy', 'Standard'],
        ['Queue', 'North America'],
      ].forEach(([label, value]) => {
        const stat = createElement('div', 'expense-stat');
        stat.appendChild(createElement('span', '', label));
        stat.appendChild(createElement('strong', '', value));
        summaryGrid.appendChild(stat);
      });
      scorecard.appendChild(summaryGrid);
      sidebar.appendChild(scorecard);

      const policy = createElement('section', 'expense-card');
      policy.appendChild(createElement('h4', '', 'Review Notes'));
      const notes = createElement('ul');
      [
        'Search-first comboboxes should stay blank until a committed option is selected.',
        'Dependent fields open only after their parent control has a committed value.',
        'Submitting should happen once every visible required field is valid.',
      ].forEach((copy) => {
        notes.appendChild(createElement('li', '', copy));
      });

      upload.appendChild(createElement('h4', '', 'Receipts'));
      upload.appendChild(createElement('div', 'expense-upload-dock', 'Drop files here or keep moving with the draft fields first.'));
      upload.appendChild(createElement('p', '', 'The upload area is intentionally non-interactive for this regression fixture so the grading path stays focused on the JS form controls.'));
