<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Background</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background:
        radial-gradient(circle at top left, rgba(14, 165, 233, 0.24), transparent 26%),
        radial-gradient(circle at bottom right, rgba(15, 118, 110, 0.20), transparent 24%),
        linear-gradient(180deg, #0f172a 0%, #111827 52%, #172033 100%);
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 48px 48px;
      opacity: 0.35;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <!-- Benchmark desktop background -->
</body>
</html>
