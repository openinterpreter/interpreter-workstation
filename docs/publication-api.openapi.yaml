openapi: 3.1.0
info:
  title: Interpreter Workstation Publication API
  version: 1.0.0
  description: Read-only publication of one sanitized OIX conversation and one allowlisted workspace subtree.
servers:
  - url: https://example.com/publication
    description: Replace with the public relay endpoint.
paths:
  /snapshot:
    get:
      summary: Read a page of public conversation messages and Goal state.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 24 }
        - name: before
          in: query
          description: Opaque exclusive cursor returned as page.nextCursor.
          schema: { type: string }
      responses:
        "200":
          description: Public conversation snapshot.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicThreadSnapshot" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /workspace:
    get:
      summary: List the public root or one relative directory.
      parameters:
        - name: path
          in: query
          description: Opaque workspace-relative directory path; omit for the root.
          schema: { type: string, default: "" }
      responses:
        "200":
          description: Directory listing.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicWorkspaceListing" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /file:
    get:
      summary: Read one published file, up to 250 MiB.
      parameters:
        - name: path
          in: query
          required: true
          description: Opaque workspace-relative file path from a workspace listing.
          schema: { type: string }
      responses:
        "200":
          description: File bytes. Content-Type depends on the allowlisted extension.
          headers:
            Content-Disposition: { schema: { type: string } }
            X-Content-Type-Options: { schema: { type: string, const: nosniff } }
          content:
            application/octet-stream:
              schema: { type: string, contentEncoding: binary }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413":
          description: File exceeds the public preview limit.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/Unavailable" }
components:
  responses:
    BadRequest:
      description: Invalid request.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Published resource not found.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Relay authentication to the private sidecar failed.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unavailable:
      description: Publication is unconfigured or reconnecting.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error: { type: string }
    PublicThreadSnapshot:
      type: object
      required: [schemaVersion, threadId, title, status, goal, messages, page, eventCursor, updatedAt]
      properties:
        schemaVersion: { type: integer, const: 1 }
        threadId: { type: string }
        title: { type: string }
        status: { enum: [connecting, working, idle, paused, error] }
        goal:
          oneOf:
            - { $ref: "#/components/schemas/PublicThreadGoal" }
            - { type: "null" }
        messages:
          type: array
          items: { $ref: "#/components/schemas/PublicThreadMessage" }
        page: { $ref: "#/components/schemas/Page" }
        eventCursor:
          oneOf:
            - { type: string }
            - { type: "null" }
        updatedAt: { type: number, description: Unix milliseconds. }
    PublicThreadGoal:
      type: object
      required: [objective, status, updatedAt]
      properties:
        objective: { type: string }
        status: { enum: [active, paused, blocked, usageLimited, budgetLimited, complete] }
        updatedAt: { type: number, description: Unix seconds from the OIX Goal protocol. }
    PublicThreadMessage:
      type: object
      required: [id, role, parts]
      properties:
        id: { type: string }
        role: { enum: [user, assistant] }
        parts:
          type: array
          items:
            oneOf:
              - { $ref: "#/components/schemas/TextPart" }
              - { $ref: "#/components/schemas/ToolPart" }
        createdAt: { type: number }
    TextPart:
      type: object
      required: [kind, content]
      properties:
        kind: { const: text }
        content: { type: string }
    ToolPart:
      type: object
      required: [kind, id, label, state]
      properties:
        kind: { const: tool }
        id: { type: string }
        label: { type: string }
        state: { enum: [loading, complete, error] }
        output: { type: string }
    Page:
      type: object
      required: [nextCursor, hasMore]
      properties:
        nextCursor:
          oneOf:
            - { type: string }
            - { type: "null" }
        hasMore: { type: boolean }
    PublicWorkspaceListing:
      type: object
      required: [schemaVersion, name, path, capabilities, entries]
      properties:
        schemaVersion: { type: integer, const: 1 }
        name: { type: string }
        path: { type: string }
        capabilities:
          type: array
          items: { enum: [browse, read] }
        entries:
          type: array
          items: { $ref: "#/components/schemas/PublicWorkspaceEntry" }
    PublicWorkspaceEntry:
      type: object
      required: [name, path, type, modifiedAt]
      properties:
        name: { type: string }
        path: { type: string }
        type: { enum: [file, directory] }
        size: { type: number, minimum: 0 }
        modifiedAt: { type: number, description: Unix milliseconds. }
