name: DCO

on:
  pull_request:

permissions:
  contents: read

jobs:
  signoff:
    name: DCO sign-off
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify commit sign-offs
        run: bash scripts/ci/check-dco.sh "${{ github.event.pull_request.base.ref }}" "${{ github.event.pull_request.head.sha }}"
