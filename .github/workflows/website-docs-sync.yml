name: Sync website docs

on:
  push:
    branches: [main]
    paths:
      - docs-site/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Mint website dispatch token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.INTERPRETERWORK_APP_ID }}
          private-key: ${{ secrets.INTERPRETERWORK_APP_PRIVATE_KEY }}
          owner: openinterpreter
          repositories: website
      - name: Dispatch website sync
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh api repos/openinterpreter/website/dispatches --method POST --field event_type=workstation_docs_changed
