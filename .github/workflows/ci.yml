name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, codex/oss-migration]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # @vscode/ripgrep resolves its prebuilt release through the GitHub API during
  # pnpm install. Authenticate that read so clean jobs do not consume the
  # shared anonymous API quota and fail intermittently with HTTP 403.
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          token: ${{ github.token }}
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.2.20
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: node --test scripts/ci/release-workflow.test.mjs
      - run: node --test scripts/electron-builder/startup-url-dependencies.test.cjs
      - run: node --test scripts/ci/select-ubuntu-apt-mirror.test.mjs
      - run: node --test scripts/ci/windows-install-path.test.mjs
      - run: node --test scripts/ci/retry-transient-download.test.mjs
      - run: node scripts/ci/retry-transient-download.mjs node_modules/electron/install.js
      - run: pnpm run test:unit
      - run: pnpm run test:vitest
      - run: pnpm run test:qwen-download-contract
      - run: pnpm audit --audit-level=high
      - name: Verify the standalone shadcn preset
        run: |
          pnpm --dir shadcn-preset/preset-app install --frozen-lockfile
          pnpm --dir shadcn-preset/preset-app audit --audit-level=high
          pnpm --dir shadcn-preset/preset-app test:glob-compat
          pnpm --dir shadcn-preset/preset-app lint
          pnpm --dir shadcn-preset/preset-app build
      - name: Generate production dependency license inventory
        run: pnpm run --silent release:licenses > production-license-inventory.json
      - name: Enforce reviewed production license policy
        run: |
          node --test scripts/release-license-cli.test.mjs
          pnpm run release:licenses:check -- production-license-inventory.json
      - name: Upload production dependency license inventory
        uses: actions/upload-artifact@v7
        with:
          name: production-license-inventory
          path: production-license-inventory.json
          if-no-files-found: error

  # The Electron suite runs its spec files one at a time. Split the files over
  # parallel runners so the suite no longer sets the length of every CI run.
  electron-e2e-shard:
    name: electron-e2e (shard ${{ matrix.shard }}/3)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          token: ${{ github.token }}
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.2.20
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - run: pnpm run download:oix -- --current-platform
      - run: node scripts/ci/retry-transient-download.mjs node_modules/electron/install.js
      # The Electron build compiles the native macOS helpers from source, which
      # takes about nine minutes when nothing is cached. The build already
      # keys each helper by a hash of its inputs, so restoring its cache
      # directory is safe: a changed input simply misses and is rebuilt.
      - name: Restore native build cache
        uses: actions/cache/restore@v6
        with:
          path: |
            .cache/trycua-cua-driver
            .cache/native-builds
          key: native-builds-${{ runner.os }}-${{ runner.arch }}-restore
          restore-keys: native-builds-${{ runner.os }}-${{ runner.arch }}-
      - run: pnpm run test:e2e:ci
        env:
          E2E_SHARD: ${{ matrix.shard }}/3
      - name: Save native build cache
        if: success()
        uses: actions/cache/save@v6
        with:
          path: |
            .cache/trycua-cua-driver
            .cache/native-builds
          key: native-builds-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.cache/trycua-cua-driver/*/build-info.json', '.cache/native-builds/**') }}

  # One stable result for the whole Electron suite: it passes only when every
  # shard passed.
  electron-e2e:
    needs: electron-e2e-shard
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every Electron shard to pass
        run: test "${{ needs.electron-e2e-shard.result }}" = "success"

  voice-e2e:
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          token: ${{ github.token }}
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.2.20
      - uses: dtolnay/rust-toolchain@stable
      - name: Use a Visual Studio 2026-compatible node-gyp
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          npm install --global node-gyp@12.3.0
          "npm_config_node_gyp=$(npm root --global)\node-gyp\bin\node-gyp.js" >> $env:GITHUB_ENV
      - run: ./scripts/ci/install-windows-deps.ps1
        shell: pwsh
      - run: pnpm run download:oix -- --current-platform
      - run: pnpm run test:e2e:voice:ci
      - name: Upload voice test diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: voice-e2e-diagnostics
          path: |
            test-runs/**/logs
            test-runs/**/test-results
          if-no-files-found: warn

  package-smoke:
    name: package-smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-26, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          token: ${{ github.token }}
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.2.20
      - uses: dtolnay/rust-toolchain@stable
      - name: Use a Visual Studio 2026-compatible node-gyp
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          npm install --global node-gyp@12.3.0
          "npm_config_node_gyp=$(npm root --global)\node-gyp\bin\node-gyp.js" >> $env:GITHUB_ENV
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-dev libxi-dev libxtst-dev libxext-dev libwayland-dev \
            libopenblas-dev
      - run: ./scripts/ci/install-windows-deps.ps1
        if: runner.os == 'Windows'
        shell: pwsh
      - run: pnpm install --frozen-lockfile
        if: runner.os != 'Windows'
      - run: pnpm run download:oix -- --current-platform
      - run: node scripts/ci/retry-transient-download.mjs scripts/download-pdfcpu.mjs --current-platform
      - run: pnpm run download:qwen-asr -- --current-platform
      - run: pnpm run build:js-repl-runtime
      - name: Restore native build cache
        if: runner.os == 'macOS'
        uses: actions/cache/restore@v6
        with:
          path: |
            .cache/trycua-cua-driver
            .cache/native-builds
          key: native-builds-${{ runner.os }}-${{ runner.arch }}-restore
          restore-keys: native-builds-${{ runner.os }}-${{ runner.arch }}-
      - run: pnpm run build
      - run: node scripts/ci/retry-transient-download.mjs node_modules/electron/install.js
      - name: Verify Windows PowerShell CLI launcher
        if: runner.os == 'Windows'
        run: pnpm exec bun test server/utils/interpreterCliRuntime.test.ts
      # Exercise the distribution wrapper on every supported runner. This is
      # especially important on Windows, where package-manager shims require
      # platform-shell resolution.
      - run: pnpm run package:smoke:official
