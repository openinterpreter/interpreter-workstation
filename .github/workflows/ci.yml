name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, codex/oss-migration]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.WORKSTATION_SUBMODULE_TOKEN || github.token }}
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.20
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm run test:unit
      - run: pnpm run test:vitest
      - run: pnpm audit --prod --audit-level=critical
      - name: Generate production dependency license inventory
        run: pnpm run --silent release:licenses > production-license-inventory.json
      - name: Upload production dependency license inventory
        uses: actions/upload-artifact@v4
        with:
          name: production-license-inventory
          path: production-license-inventory.json
          if-no-files-found: error

  electron-e2e:
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.WORKSTATION_SUBMODULE_TOKEN || github.token }}
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.20
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:e2e:ci

  voice-e2e:
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.WORKSTATION_SUBMODULE_TOKEN || github.token }}
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.20
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:e2e:voice:ci

  package-smoke:
    name: package-smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-26, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.WORKSTATION_SUBMODULE_TOKEN || github.token }}
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.20
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-dev libxi-dev libxtst-dev libxext-dev libwayland-dev
      - run: pnpm install --frozen-lockfile
      - run: pnpm run download:codex -- --current-platform
      - run: pnpm run download:oix -- --current-platform
      - run: pnpm run download:pdfcpu -- --current-platform
      - run: pnpm run download:qwen-asr -- --current-platform
      - run: pnpm run build:js-repl-runtime
      - run: pnpm run build
      - run: pnpm run package:smoke
