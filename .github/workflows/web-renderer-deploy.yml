name: Deploy web renderer

on:
  push:
    branches: [main]
    paths:
      - "agent/**"
      - "apps/interpreter-marketing-demo/**"
      - "src/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/web-renderer-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-renderer-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_WEB_RENDERER_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run marketing-demo:build
      - name: Deploy immutable static build
        run: pnpm dlx vercel@latest deploy apps/interpreter-marketing-demo/dist --prod --yes --token "$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
