name: Deploy web renderer

on:
  push:
    branches: [main]
    paths:
      - "agent/**"
      - "apps/interpreter-marketing-demo/**"
      - "src/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/web-renderer-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-renderer-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_WEB_RENDERER_PROJECT_ID }}
    steps:
      - name: Detect optional token deployment
        id: deployment
        shell: bash
        run: |
          if [[ -n "$VERCEL_TOKEN" && -n "$VERCEL_ORG_ID" && -n "$VERCEL_PROJECT_ID" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Token deployment is not configured; use a Git-connected static host or add the documented repository secrets."
          fi
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - uses: actions/checkout@v4
        if: steps.deployment.outputs.enabled == 'true'
      - uses: pnpm/action-setup@v4
        if: steps.deployment.outputs.enabled == 'true'
      - uses: actions/setup-node@v4
        if: steps.deployment.outputs.enabled == 'true'
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.deployment.outputs.enabled == 'true'
      - run: pnpm run marketing-demo:build
        if: steps.deployment.outputs.enabled == 'true'
      - name: Prepare immutable Vercel build output
        if: steps.deployment.outputs.enabled == 'true'
        shell: bash
        run: |
          mkdir -p .vercel/output/static
          cp -R apps/interpreter-marketing-demo/dist/. .vercel/output/static/
          node -e 'require("node:fs").writeFileSync(".vercel/output/config.json", JSON.stringify({ version: 3 }))'
      - name: Deploy immutable static build
        if: steps.deployment.outputs.enabled == 'true'
        run: pnpm dlx vercel@latest deploy --prebuilt --prod --yes --token "$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
