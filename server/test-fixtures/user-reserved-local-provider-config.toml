  { id = "custom:1774338843371-0", isBuiltin = false, modelId = "interpreter-smart", name = "Interpreter Smart", provider = "hosted", providerId = "builtin:hosted" },
  { id = "custom:1774338843382-1", isBuiltin = false, modelId = "interpreter-fast", name = "Interpreter Fast", provider = "hosted", providerId = "builtin:hosted" },
  { command = "claude", hideInput = true, icon = "claude", id = "custom:1774615269314", isBuiltin = false, modelId = "claude-code", name = "Claude Code Terminal", provider = "terminal", richInput = false },
  { command = "codex", hideInput = true, icon = "openai", id = "custom:1774615283062", isBuiltin = false, modelId = "codex", name = "Interpreter Terminal", provider = "terminal", richInput = false },
