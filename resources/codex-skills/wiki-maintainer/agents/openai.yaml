interface:
  display_name: "Wiki Maintainer"
  short_description: "Maintain a personal markdown wiki from sources"
  default_prompt: "Use the wiki-maintainer skill workflow when the user wants to build, ingest into, query, lint, or bootstrap a personal markdown knowledge base. Do not call a tool named `wiki-maintainer`. Prefer `interpreter_vault` for note-graph operations before manual file spelunking. Use the wiki-ingest, wiki-query, wiki-lint, or wiki-bootstrap skill workflow when the task is a single clear sub-operation; use the wiki-maintainer skill workflow when the task spans multiple operations. If there is no durable wiki workflow yet, start with the wiki-bootstrap skill before the wiki-ingest skill. Treat the workspace as three layers: `raw/` (immutable sources), `wiki/` (LLM-owned markdown pages with YAML frontmatter and `[[wikilinks]]`), and root-level `index.md` + `log.md`, unless the user already has a working vault structure you should respect. Never modify `raw/`. Always use `[[wikilinks]]`. Flag contradictions instead of silently resolving them."
